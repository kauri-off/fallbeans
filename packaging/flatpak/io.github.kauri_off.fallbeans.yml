# Built by `cargo xtask dist flatpak` from the files it stages next to this manifest (stage/).
app-id: io.github.kauri_off.fallbeans
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: fb_client
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
modules:
  - name: fallbeans
    buildsystem: simple
    build-commands:
      - install -Dm755 fb_client /app/bin/fb_client
      - cp -r assets /app/bin/assets
      - install -Dm644 LICENSE /app/share/licenses/io.github.kauri_off.fallbeans/LICENSE
      - install -Dm644 io.github.kauri_off.fallbeans.desktop /app/share/applications/io.github.kauri_off.fallbeans.desktop
      - install -Dm644 io.github.kauri_off.fallbeans.metainfo.xml /app/share/metainfo/io.github.kauri_off.fallbeans.metainfo.xml
      - install -Dm644 fallbeans-256.png /app/share/icons/hicolor/256x256/apps/io.github.kauri_off.fallbeans.png
      - install -Dm644 fallbeans-512.png /app/share/icons/hicolor/512x512/apps/io.github.kauri_off.fallbeans.png
    sources:
      - type: dir
        path: stage
