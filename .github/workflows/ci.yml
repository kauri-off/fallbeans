name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The determinism test above compares against one recorded file: passing on both OSes is the
      # cross-platform check. This one plays real rounds over the network without a GPU.
      - name: Network smoke (server + 4 headless clients, 80 ms RTT, 2% loss)
        run: cargo xtask stress --clients 4 --secs 30 --lag 40 --jitter 10 --loss 0.02
      - name: Stress logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: stress-${{ matrix.os }}
          path: target/stress/
