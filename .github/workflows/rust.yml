name: rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

defaults:
  run:
    working-directory: rust

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The determinism test above compares against one recorded file: passing on both OSes is the
      # cross-platform check. This one plays real rounds over the network without a GPU.
      - name: Network smoke (server + 4 headless clients, 80 ms RTT, 2% loss)
        run: cargo xtask stress --clients 4 --secs 30 --lag 40 --jitter 10 --loss 0.02
      - name: Stress logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.os }}
          path: rust/target/stress/
