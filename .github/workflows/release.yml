# Release v<Cargo.toml version>: packages built in parallel, then one GitHub release with SHA256SUMS.
# Every action is pinned to a commit (the tag in the comment): the jobs build what every player then installs.
name: release

on:
  workflow_dispatch:

# Read-only for the build jobs (they run third-party tools); only the release job writes.
permissions:
  contents: read

concurrency: release

env:
  CARGO_TERM_COLOR: always
  LINUX_PACKAGES: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
  # The Linux client packages' upscalers: bindgen for DLSS, FidelityFX's build, the DLSS guide as text, unzip for `setup`.
  UPSCALER_PACKAGES: clang libclang-dev cmake glslang-tools libvulkan-dev patch poppler-utils unzip

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      toolchain: ${{ steps.v.outputs.toolchain }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The self-updater installs every release for every player: only master is released.
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::releases are made from master only (this run: $GITHUB_REF)"
            exit 1
          fi
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          # A tag without its release is a run that failed after the release job made the tag: build it again.
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$v is already released: raise the version in Cargo.toml"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            # (An annotated tag's commit is its peeled `^{}` entry.)
            tagged=$(git ls-remote origin "refs/tags/v$v^{}" | cut -f1)
            [ -n "$tagged" ] || tagged=$(git ls-remote origin "refs/tags/v$v" | cut -f1)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::tag v$v is on $tagged, not on this commit: delete the tag or raise the version"
              exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

  nsis:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ needs.version.outputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: choco install nsis --no-progress -y
      # (After rust-cache: its post step would empty target/sdk before this one saves it.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sdk
          key: sdk-${{ github.job }}-${{ hashFiles('toolchain/deps.toml') }}
      - run: cargo xtask setup --dist
      - run: cargo xtask dist nsis
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nsis
          path: dist/*.exe
          if-no-files-found: error

  appimage:
    needs: version
    # Built inside Ubuntu 22.04, the oldest supported one: its glibc is what the AppImage needs at least. A
    # container on a current runner, since GitHub retires the ubuntu-22.04 runner image (gone 2027-04-17).
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # (The bare image: what the runner images have and the steps below need, `file` for appimagetool. Steps run as root here.)
      - name: packages
        run: |
          # shellcheck disable=SC2086 # (a list of packages)
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file $LINUX_PACKAGES $UPSCALER_PACKAGES
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ needs.version.outputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # (After rust-cache: its post step would empty target/sdk before this one saves it.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sdk
          key: sdk-${{ github.job }}-${{ hashFiles('toolchain/deps.toml') }}
      - run: cargo xtask setup --dist
      - run: cargo xtask dist appimage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  deb:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ needs.version.outputs.toolchain }}
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake unzip
      # (After rust-cache: its post step would empty target/sdk before this one saves it.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sdk
          key: sdk-${{ github.job }}-${{ hashFiles('toolchain/deps.toml') }}
      - run: cargo xtask setup --dist
      - run: cargo xtask dist deb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: [version, nsis, appimage, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          # GitHub renames assets with characters other than letters, digits and @-_+. (the `~` of the
          # server packages' version becomes `.`): rename first, so SHA256SUMS names the files as published.
          for f in ./*~*; do
            if [ -e "$f" ]; then mv -- "$f" "${f//\~/.}"; fi
          done
          sha256sum ./* > SHA256SUMS
          sed -i 's| \./| |' SHA256SUMS
          cat SHA256SUMS
          title="Fall Beans $(echo "$VERSION" | sed -E 's/-(.*)$/ \U\1/')"
          sed "s/@VERSION@/$VERSION/g" ../packaging/release-notes.md > notes.md
          # (A tag left by a failed run, on this commit: the release goes on it.)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md \
            ./*.exe ./*.AppImage ./*.deb SHA256SUMS
