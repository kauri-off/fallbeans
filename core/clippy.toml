# The deterministic core only (clippy reads the nearest clippy.toml above a crate): same bits on every OS.
disallowed-methods = [
  { path = "f64::sin", reason = "use fb_shared::m (libm: same bits on every OS)" },
  { path = "f64::cos", reason = "use fb_shared::m" },
  { path = "f64::tan", reason = "use fb_shared::m" },
  { path = "f64::atan", reason = "use fb_shared::m" },
  { path = "f64::atan2", reason = "use fb_shared::m" },
  { path = "f64::exp", reason = "use fb_shared::m" },
  { path = "f64::powf", reason = "use fb_shared::m" },
  { path = "f64::powi", reason = "use fb_shared::m" },
  { path = "f64::hypot", reason = "platform libm: use fb_shared::m::hypot" },
  { path = "f64::mul_add", reason = "no FMA in the simulation" },
  { path = "f64::sin_cos", reason = "use fb_shared::m" },
  { path = "f64::asin", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::acos", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::sinh", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::cosh", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::tanh", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::exp2", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::exp_m1", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::ln", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::ln_1p", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::log", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::log2", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::log10", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  { path = "f64::cbrt", reason = "platform libm: add a libm wrapper to fb_shared::m" },
  # Not the same bits in every build, or not what the simulation means.
  { path = "f64::max", reason = "±0 tie is unspecified: use fb_shared::m::max/min or .at_least/.at_most" },
  { path = "f64::min", reason = "±0 tie is unspecified: use fb_shared::m::max/min or .at_least/.at_most" },
  { path = "f64::signum", reason = "signum(0) is 1: use fb_shared::m::sign" },
  # glam turns angles into rotations through the platform's sin_cos: use fb_sim::math::euler_xyz.
  { path = "glam::DQuat::from_euler", reason = "platform sin_cos: use fb_sim::math::euler_xyz" },
  { path = "glam::DQuat::from_axis_angle", reason = "platform sin_cos: use fb_sim::math::euler_xyz" },
  { path = "glam::DQuat::from_rotation_x", reason = "platform sin_cos: use fb_sim::math::euler_xyz" },
  { path = "glam::DQuat::from_rotation_y", reason = "platform sin_cos: use fb_sim::math::euler_xyz" },
  { path = "glam::DQuat::from_rotation_z", reason = "platform sin_cos: use fb_sim::math::euler_xyz" },
  { path = "glam::DMat3::from_euler", reason = "platform sin_cos: use fb_sim::math::euler_xyz" },
  { path = "glam::DAffine3::from_rotation_y", reason = "platform sin_cos: use fb_sim::math::euler_xyz" },
  { path = "std::time::Instant::now", reason = "no wall clock in the simulation" },
  { path = "std::time::SystemTime::now", reason = "no wall clock in the simulation" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "random iteration order: BTreeMap, IndexMap or Vec" },
  { path = "std::collections::HashSet", reason = "random iteration order: BTreeSet or Vec" },
  { path = "f32", reason = "the simulation is f64; f32 only at the render boundary" },
  { path = "std::time::Instant", reason = "no wall clock in the simulation" },
  { path = "std::time::SystemTime", reason = "no wall clock in the simulation" },
]
