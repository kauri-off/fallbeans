[workspace]
resolver = "3"
# core/: the deterministic simulation (no Bevy, its own clippy.toml); crates/: networking, server, client.
members = ["core/*", "crates/*", "xtask"]
# Patched upstream crates ([patch.crates-io] below): not members, but cargo run inside them must not look up here.
exclude = ["vendor/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
fb_shared = { path = "core/fb_shared" }
fb_sim = { path = "core/fb_sim" }
fb_maps = { path = "core/fb_maps" }
fb_arena = { path = "core/fb_arena" }
fb_net = { path = "crates/fb_net" }
fb_proto = { path = "crates/fb_proto" }
# Engine and networking: pinned exactly, they move together.
bevy = { version = "=0.19.1", default-features = false }
# The wgpu types Bevy 0.19.1 builds on (adapter info: backend, device type).
wgpu-types = { version = "=29.0.3", default-features = false }
# The wgpu Bevy 0.19.1 builds on: the client picks its graphics API with it before Bevy starts; the client's tests
# take its noop device (no GPU).
wgpu = { version = "=29.0.4", default-features = false }
lightyear = { version = "=0.30.1", default-features = false }
# What Lightyear 0.30.1 itself builds on; named here for APIs it does not re-export.
bevy_replicon = { version = "=0.44.2", default-features = false }
aeronet_websocket = { version = "=0.21.0", default-features = false }
lightyear_udp = { version = "=0.30.1", default-features = false }
lightyear_sync = { version = "=0.30.1", default-features = false }
lightyear_transport = { version = "=0.30.1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
# SIGTERM and SIGHUP too (`termination`): the server shuts down gracefully on `systemctl stop`.
ctrlc = { version = "3.4", features = ["termination"] }
getrandom = "0.3"
glam = { version = "=0.32.1", default-features = false, features = ["std", "serde"] }
hmac = "0.12"
libm = "=0.2.16"
meshopt = "0.6"
# The glyph rasterizer Bevy's text uses (emoji on the maps' boards).
swash = "0.2"
rayon = "1.11"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-reflection = { version = "0.6", default-features = false }
sha2 = "0.10"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.dev]
opt-level = 1
# Backtraces keep their lines; locals in a debugger go. Much smaller debug info, much faster links.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# The simulation at full speed in dev builds too (stress and audits without --release): bit-identical, Rust never
# contracts floating-point operations into FMA at any opt-level.
[profile.dev.package.fb_shared]
opt-level = 3

[profile.dev.package.fb_sim]
opt-level = 3

[profile.dev.package.fb_maps]
opt-level = 3

[profile.dev.package.fb_arena]
opt-level = 3

# panic = "unwind" (the default) stays everywhere: the server catches a room's panic (`catch_unwind`).
[profile.release]
lto = "thin"

# Measuring and optimizing (`cargo xtask perf`): release code, rebuilt in seconds (no LTO, incremental).
[profile.perf]
inherits = "release"
lto = false
incremental = true
codegen-units = 256

# Release packages (`cargo xtask dist`), client and server: the release profile's thin LTO (fat LTO with one codegen
# unit took a single core for 10+ minutes a package, for an unmeasured few %). Symbols and line tables stay (nothing
# is stripped): crash reports name the function and the line in their backtrace. On Windows those come from the PDB,
# which the installer puts beside the exe.
[profile.dist]
inherits = "release"
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
# A byte index into a str panics inside a character (Cyrillic, emoji): `get`, `split_once`, `char_indices`.
string_slice = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"

# Local fixes to dependencies, each to drop once upstream has it.
[patch.crates-io]
# The WebSocket server: Nagle off (only the client could turn it off: +15 ms RTT on wss), a handshake timeout,
# accept errors that do not end the server, connection caps, a small tokio runtime ("fallbeans patch" in the code).
aeronet_websocket = { path = "vendor/aeronet_websocket" }
# A fragmented message allocates whatever fragment count the peer declares, and partial reliable messages
# never expire: one packet could take all memory of the server or a client. An acked message the receiver
# refuses or expires leaves a hole in a reliable channel: `Transport::receive_failed`, and the link is dropped.
lightyear_transport = { path = "vendor/lightyear_transport" }
# DLSS through Bevy's binding (only with the client's `dlss` feature): the model is chosen per mode (DLSS 4.5's
# preset M, `DlssSdk::set_render_preset`), and a result code the SDK does not name is an error, not a panic.
dlss_wgpu = { path = "vendor/dlss_wgpu" }
