# Fall Beans at /fallbeans/. Installed as /etc/nginx/apps.d/fallbeans.conf by scripts/deploy.ts; the shared
# site (SharedServer repository) includes /etc/nginx/apps.d/*.conf inside its main server block.
#
# nginx serves the static client; the Bun game server (127.0.0.1:7777) answers /fallbeans/api/,
# /fallbeans/ws and /fallbeans/health. WebTransport goes to Bun directly over UDP 443.
# The game is open to everyone (private rooms ask for their own PIN inside the game); the debug
# API wants the debug key.

location = /fallbeans {
    return 301 /fallbeans/;
}

# The page with the site PIN is gone: old bookmarks go to the game.
location ^~ /fallbeans/pin/ {
    return 302 /fallbeans/;
}

# Debug key login: few attempts.
location = /fallbeans/api/debug/login {
    limit_req zone=fb_auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:7777;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /fallbeans/api/ {
    limit_req zone=fb_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:7777;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location = /fallbeans/health {
    proxy_pass http://127.0.0.1:7777;
    proxy_set_header Host $host;
}

# Game connection over WebSocket (fallback when UDP/WebTransport is unavailable).
location = /fallbeans/ws {
    proxy_pass http://127.0.0.1:7777;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Hashed build files: cached for a year.
location ^~ /fallbeans/assets/ {
    root /opt/fallbeans/current/www;
    include /etc/nginx/apps.d/fallbeans.headers;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Debug page (static; its data comes from /fallbeans/api/debug/, which wants the debug key).
location ^~ /fallbeans/debug/ {
    root /opt/fallbeans/current/www;
    include /etc/nginx/apps.d/fallbeans.headers;
    add_header Cache-Control "no-cache" always;
    try_files $uri /fallbeans/debug/index.html;
}

location ^~ /fallbeans/ {
    root /opt/fallbeans/current/www;
    include /etc/nginx/apps.d/fallbeans.headers;
    add_header Cache-Control "no-cache" always;
    try_files $uri /fallbeans/index.html;
}
