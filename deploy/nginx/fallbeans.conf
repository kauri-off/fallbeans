# Fall Beans at /fallbeans/. Installed as /etc/nginx/apps.d/fallbeans.conf by scripts/deploy.ts; the shared
# site (SharedServer repository) includes /etc/nginx/apps.d/*.conf inside its main server block.
#
# nginx serves the static client; the Bun game server (127.0.0.1:7777) answers /fallbeans/api/,
# /fallbeans/ws and /fallbeans/health. WebTransport goes to Bun directly over UDP 443.
# Everything except the PIN page needs the fb_auth cookie (checked by Bun through auth_request).

location = /fallbeans {
    return 301 /fallbeans/;
}

location = /fallbeans/_auth {
    internal;
    proxy_pass http://127.0.0.1:7777/fallbeans/api/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

location @fallbeans_pin {
    return 302 /fallbeans/pin/;
}

# The PIN page and its files: open to everyone.
location ^~ /fallbeans/pin/ {
    root /opt/fallbeans/current/www;
    include /etc/nginx/apps.d/fallbeans.headers;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html =404;
}

location = /fallbeans/api/auth {
    limit_req zone=fb_auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:7777;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /fallbeans/api/ {
    limit_req zone=fb_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:7777;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location = /fallbeans/health {
    proxy_pass http://127.0.0.1:7777;
    proxy_set_header Host $host;
}

# Game connection over WebSocket (fallback when UDP/WebTransport is unavailable).
location = /fallbeans/ws {
    proxy_pass http://127.0.0.1:7777;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Hashed build files: cached for a year.
location ^~ /fallbeans/assets/ {
    auth_request /fallbeans/_auth;
    error_page 401 = @fallbeans_pin;
    root /opt/fallbeans/current/www;
    include /etc/nginx/apps.d/fallbeans.headers;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Debug page (static; its data comes from /fallbeans/api/debug/, which also wants the debug key).
location ^~ /fallbeans/debug/ {
    auth_request /fallbeans/_auth;
    error_page 401 = @fallbeans_pin;
    root /opt/fallbeans/current/www;
    include /etc/nginx/apps.d/fallbeans.headers;
    add_header Cache-Control "no-cache" always;
    try_files $uri /fallbeans/debug/index.html;
}

location ^~ /fallbeans/ {
    auth_request /fallbeans/_auth;
    error_page 401 = @fallbeans_pin;
    root /opt/fallbeans/current/www;
    include /etc/nginx/apps.d/fallbeans.headers;
    add_header Cache-Control "no-cache" always;
    try_files $uri /fallbeans/index.html;
}
