# Fall Beans at /fallbeans/. Installed as /etc/nginx/apps.d/fallbeans.conf by `cargo xtask deploy`; the site
# of the domain includes /etc/nginx/apps.d/*.conf inside its https server block.
#
# The game is a native client: its UDP (5888) goes to the server directly. Through here: the HTTP API
# (connect tokens, health, debug) and the WebSocket fallback for players whose UDP is cut (VPN rules,
# filtering): https and wss on TCP 443 pass wherever the site opens. /fallbeans/ws-probe and
# /fallbeans/probe/ are the temporary server of `cargo xtask stress --remote`.

location = /fallbeans/health {
    proxy_pass http://127.0.0.1:5887;
    include /etc/nginx/apps.d/fallbeans.http;
}

location /fallbeans/api/ {
    proxy_pass http://127.0.0.1:5887;
    include /etc/nginx/apps.d/fallbeans.http;
}

location /fallbeans/probe/ {
    proxy_pass http://127.0.0.1:5892/fallbeans/;
    include /etc/nginx/apps.d/fallbeans.http;
}

location = /fallbeans/ws {
    proxy_pass http://127.0.0.1:5889;
    include /etc/nginx/apps.d/fallbeans.ws;
}

location = /fallbeans/ws-probe {
    proxy_pass http://127.0.0.1:5891;
    include /etc/nginx/apps.d/fallbeans.ws;
}
