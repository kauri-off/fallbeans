<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Beans</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7cc6ff; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; user-select: none; }
  canvas { display: block; }
  .hidden { display: none !important; }
  .panel { position: absolute; background: rgba(255,255,255,0.92); border-radius: 22px; box-shadow: 0 8px 0 rgba(80,40,160,0.35), 0 16px 40px rgba(0,0,0,0.2); color: #3a2372; }
  h1, h2, h3 { margin: 0; }
  .title { font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 4px 0 #b43aa0, 0 8px 18px rgba(0,0,0,0.25); }
  button { font: inherit; font-weight: 800; border: none; border-radius: 14px; padding: 12px 22px; cursor: pointer; background: #ffd23f; color: #3a2372; box-shadow: 0 5px 0 #c99a00; transition: transform .08s; }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c99a00; }
  button:disabled { background: #ccc; box-shadow: 0 5px 0 #999; cursor: default; transform: none; }
  input { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 12px; border: 3px solid #a66bff; outline: none; width: 100%; color: #3a2372; }

  #lobby { left: 24px; top: 24px; width: 360px; padding: 20px; }
  #lobby h1 { font-size: 38px; margin-bottom: 6px; }
  #lobby .sub { font-size: 13px; opacity: .75; margin-bottom: 12px; }
  #plist { list-style: none; padding: 0; margin: 12px 0; }
  #plist li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #f1ebff; margin-bottom: 6px; font-weight: 800; }
  #plist .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.15); }
  #plist .tag { margin-left: auto; font-size: 12px; opacity: .7; }
  #swatches { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  #swatches div { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.15); }
  #swatches div.taken { opacity: .25; cursor: default; }
  #swatches div.mine { box-shadow: 0 0 0 3px #3a2372; }
  #startBtn { width: 100%; margin-top: 12px; font-size: 20px; }
  #startHint { font-size: 13px; text-align: center; margin-top: 8px; opacity: .8; }

  #help { right: 24px; bottom: 24px; padding: 14px 18px; font-size: 13px; line-height: 1.6; }
  #help b { display: inline-block; min-width: 92px; }

  #hud { position: absolute; inset: 0; pointer-events: none; }
  #roundInfo { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 10px 22px; text-align: center; min-width: 280px; }
  #roundInfo .name { font-size: 22px; font-weight: 900; }
  #roundInfo .stat { font-size: 15px; font-weight: 700; opacity: .85; }
  #timer { position: absolute; top: 22px; right: 26px; font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #3a2372; }
  #big { position: absolute; top: 38%; left: 0; right: 0; text-align: center; font-size: 96px; font-weight: 900; color: #fff; text-shadow: 0 6px 0 #b43aa0, 0 12px 30px rgba(0,0,0,.3); transition: transform .15s; }
  #big.pop { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1); } }
  #sub { position: absolute; top: calc(38% + 110px); left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 3px 0 rgba(58,35,114,.8); }
  #feed { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  #feed div { background: rgba(255,255,255,.9); color: #3a2372; font-weight: 800; padding: 6px 12px; border-radius: 10px; animation: pop .4s; }
  #spec { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); padding: 10px 20px; font-weight: 800; }

  #intro { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; padding: 28px; text-align: center; }
  #intro .kind { font-size: 15px; font-weight: 800; color: #b43aa0; text-transform: uppercase; letter-spacing: 2px; }
  #intro h2 { font-size: 46px; margin: 6px 0 10px; }
  #intro p { font-size: 17px; margin: 0 0 10px; }
  #intro .goal { background: #ffd23f; border-radius: 12px; padding: 8px; font-weight: 900; }

  #results { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; padding: 24px; }
  #results h2 { text-align: center; font-size: 32px; margin-bottom: 12px; }
  #results .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; font-weight: 800; }
  #results .ok { background: #d8f8dc; } #results .bad { background: #ffd9e1; text-decoration: line-through; }
  #results .row span:last-child { margin-left: auto; }

  #menu { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 380px; padding: 28px; text-align: center; }
  #menu h1 { font-size: 52px; margin-bottom: 14px; }
  #menu button { width: 100%; margin-top: 14px; font-size: 22px; }
  #menu .err { color: #d0164f; font-weight: 800; margin-top: 10px; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
  <div id="loading" class="title">Загрузка…</div>

  <div id="menu" class="panel hidden">
    <h1 class="title">FALL BEANS</h1>
    <input id="nameInput" maxlength="16" placeholder="Ваше имя">
    <button id="playBtn">ИГРАТЬ</button>
    <div id="menuErr" class="err"></div>
  </div>

  <div id="lobby" class="panel hidden">
    <h1 class="title">FALL BEANS</h1>
    <div class="sub">Лобби · бегайте, пока все собираются</div>
    <div>Цвет вашего боба:</div>
    <div id="swatches"></div>
    <ul id="plist"></ul>
    <button id="startBtn">НАЧАТЬ ШОУ</button>
    <div id="startHint"></div>
  </div>

  <div id="help" class="panel hidden">
    <div><b>WASD / ←↑→↓</b> бег</div>
    <div><b>Мышь</b> камера (клик — захват)</div>
    <div><b>Пробел</b> прыжок</div>
    <div><b>E / ЛКМ</b> нырок</div>
    <div><b>Q / ПКМ</b> хватать</div>
    <div><b>1 / 2 / 3</b> эмоции</div>
    <div><b>H</b> скрыть подсказку</div>
    <div><b>Геймпад</b> тоже работает</div>
  </div>

  <div id="hud" class="hidden">
    <div id="roundInfo" class="panel"><div class="name"></div><div class="stat"></div></div>
    <div id="timer"></div>
    <div id="feed"></div>
    <div id="big"></div>
    <div id="sub"></div>
    <div id="spec" class="panel hidden"></div>
  </div>

  <div id="intro" class="panel hidden">
    <div class="kind"></div>
    <h2></h2>
    <p class="desc"></p>
    <div class="goal"></div>
  </div>

  <div id="results" class="panel hidden"><h2></h2><div class="list"></div></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
