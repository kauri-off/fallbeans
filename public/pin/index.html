<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='55' rx='30' ry='40' fill='%23ff5fa2'/%3E%3Cellipse cx='58' cy='40' rx='14' ry='9' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Fall Beans — вход</title>
    <link rel="stylesheet" href="pin.css" />
  </head>
  <body>
    <form class="card" id="form" autocomplete="off">
      <h1>Fall Beans</h1>
      <p>Введите PIN-код</p>
      <div class="digits" id="digits">
        <input inputmode="numeric" maxlength="4" aria-label="Цифра 1" />
        <input inputmode="numeric" maxlength="4" aria-label="Цифра 2" />
        <input inputmode="numeric" maxlength="4" aria-label="Цифра 3" />
        <input inputmode="numeric" maxlength="4" aria-label="Цифра 4" />
      </div>
      <p class="msg" id="msg" role="status"></p>
      <button type="submit" id="go">Войти</button>
      <p class="small">В этом браузере PIN запомнится.</p>
    </form>
    <script src="pin.js"></script>
  </body>
</html>
