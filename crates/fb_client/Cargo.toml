[package]
name = "fb_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fb_shared.workspace = true
fb_sim.workspace = true
fb_maps.workspace = true
fb_arena.workspace = true
fb_net.workspace = true
fb_proto.workspace = true
bevy = { workspace = true, features = ["3d", "ui", "jpeg", "bevy_audio", "wav", "bevy_settings", "system_clipboard", "sysinfo_plugin"] }
wgpu-types.workspace = true
# The graphics API is chosen before Bevy's renderer starts (`backend.rs`): the adapters of DX12 and Vulkan.
# (Bevy builds wgpu with DX12, Vulkan and Metal only: no OpenGL.)
wgpu.workspace = true
aeronet_websocket = { workspace = true, features = ["client"] }
bevy_replicon = { workspace = true, features = ["client"] }
base64.workspace = true
meshopt.workspace = true
swash.workspace = true
semver.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
ureq.workspace = true
lightyear_udp.workspace = true
lightyear_sync.workspace = true
lightyear_transport.workspace = true
lightyear = { workspace = true, features = ["client", "std", "replication", "prediction", "interpolation", "input_native", "netcode", "udp", "websocket"] }

[dev-dependencies]
# The client's tests: a real server in their process, drawing on wgpu's noop device.
fb_server = { path = "../fb_server" }
wgpu = { workspace = true, features = ["noop"] }

[build-dependencies]
winresource = "0.1"

[features]
default = ["brp", "profiler"]
# The Bevy Remote Protocol probe (`--brp`): off in distributed builds.
brp = ["bevy/bevy_remote"]
# Bevy's spans for every system: the built-in profiler of the F4 overlay (`perf/profiler.rs`).
profiler = ["bevy/trace"]
# The same spans to Tracy (https://github.com/wolfpld/tracy), with the GPU's passes: development only.
tracy = ["profiler", "bevy/trace_tracy"]
# The same spans to a `trace-*.json` for https://ui.perfetto.dev (`TRACE_CHROME=path` names the file).
chrome = ["profiler", "bevy/trace_chrome"]

[lints]
workspace = true
