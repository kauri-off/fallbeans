[alias]
# `--locked`: a Cargo.lock behind Cargo.toml is an error (`cargo update --workspace`), never a silent update.
xtask = "run -q --locked --package xtask --"

# The C runtime linked into the exe: a clean Windows has no VCRUNTIME140.dll and the installer does not ship it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
