[alias]
# `--locked`: a Cargo.lock behind Cargo.toml is an error (`cargo update --workspace`), never a silent update.
xtask = "run -q --locked --package xtask --"

# LLVM's linker that comes with rustup: links the client several times faster than MSVC's link.exe. (The C
# runtime is linked into the packaged exe only, `cargo xtask dist`: set here it would split the build cache.)
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
