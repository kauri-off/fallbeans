<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fall Beans — макет B</title>
<style>
:root{--paper:#F4F3EF;--paper2:#E9E7E1;--white:#fff;--ink:#111214;--ink2:#3E4046;--mute:#5F6167;--rule:#D3D0C8;--rule2:#A9A69E;--acc:#FFC400;--acct:#FFF0BF;--red:#C3161C;--green:#11773F;--race:#1E58CF;--surv:#B23F0C;--pts:#0A7572;--gold:#E2B41B;--silver:#C3C7CC;--bronze:#CF9161;--hud:#111214;--hud3:#2B2C31;--hm:#A9ACB3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#2A2B2E}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

#mock{position:fixed;top:0;left:0;right:0;height:54px;background:#E4E4E4;border-bottom:1px solid #AFAFAF;font:11px/1 ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;color:#222;z-index:10;padding:4px 8px;display:flex;flex-direction:column;gap:4px}
#mock .row{display:flex;gap:3px;align-items:center;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#mock .row::-webkit-scrollbar{display:none}
#mock .lbl{color:#555;flex:none;width:52px}
#mock button{flex:none;border:1px solid #A8A8A8;background:#F6F6F6;padding:4px 7px;color:#222;border-radius:0}
#mock button.on{background:#222;color:#fff;border-color:#222}
#vp{position:fixed;left:0;right:0;bottom:0;top:54px;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--paper);color:var(--ink);font:16px/1.35 "Helvetica Neue",Helvetica,Arial,"Liberation Sans",Roboto,"Noto Sans",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-weight:700;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--ink);color:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.pri:hover{background:#EDB500;border-color:#EDB500;color:var(--ink)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover,.btn.danger.fill{background:var(--red);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.lg{height:56px;font-size:19px;padding:0 28px}
.btn.wide{width:100%}
.btn[disabled]{background:var(--paper2);border-color:var(--paper2);color:#75777D;cursor:default}
.btn.txt{border:0;padding:0;height:auto;background:none;text-decoration:underline;text-underline-offset:3px}
.btn.txt:hover{background:none;color:inherit}
.btn.x{width:36px;padding:0;border-color:transparent;font-size:22px;font-weight:400;color:var(--mute)}
.btn.x.sm{width:30px}
.btn.x:hover{background:var(--paper2);color:var(--ink)}
.inp{height:40px;border:1px solid var(--rule2);background:#fff;border-radius:2px;padding:0 12px;font-size:16px;min-width:0;width:100%}
.inp:focus{outline:2px solid var(--ink);outline-offset:-2px;border-color:var(--ink)}
.inp::placeholder{color:#74767C}
.inp.bad{border-color:var(--red);outline:2px solid var(--red);outline-offset:-2px}
.field{display:flex;gap:8px}
.field .inp{flex:1}
.h1{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
.h2{font-size:21px;font-weight:700;letter-spacing:-.01em;padding-bottom:9px;border-bottom:2px solid var(--ink);margin-bottom:12px;display:flex;align-items:baseline;gap:12px}
.h2 .aux{margin-left:auto;font-size:14px;font-weight:400;color:var(--mute)}
.cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.lab2{font-size:14px;font-weight:700;margin:14px 0 7px}
.muted{color:var(--mute)}
.note{font-size:14px;color:var(--mute);line-height:1.45}
.red{color:var(--red)}
.errt{color:var(--red);font-size:14px;font-weight:700;margin-top:8px}
.vs{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.grow{flex:1}

.tgr{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px;cursor:pointer;font-size:15px;user-select:none}
.tg{flex:none;width:40px;height:22px;border-radius:2px;background:var(--rule2);position:relative;transition:background .12s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:1px;background:#fff;transition:left .12s}
.tg.on{background:var(--ink)}
.tg.on::after{left:21px}
.sr{padding:5px 0 9px}
.sr .lab{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.sl{position:relative;height:20px}
.sl .tr{position:absolute;left:0;right:0;top:9px;height:3px;background:var(--rule)}
.sl .fi{position:absolute;left:0;top:9px;height:3px;width:var(--p);background:var(--ink)}
.sl .df{position:absolute;top:3px;left:var(--d);width:2px;height:15px;margin-left:-1px;background:var(--rule2)}
.sl .th{position:absolute;top:2px;left:var(--p);width:16px;height:16px;margin-left:-8px;background:var(--ink);border-radius:2px}
.sl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border:1px solid var(--rule2);background:#fff;border-radius:2px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[disabled]{background:transparent;color:#7B7D83;border-style:dashed;cursor:default;font-weight:400}
.chips.sm .chip{height:28px;padding:0 9px;font-size:13px}
.fold>.fold-h{cursor:pointer;user-select:none}
.fold>.fold-h .ch{margin-left:auto;font-weight:400;font-size:22px;line-height:.8;width:18px;text-align:center}
.fold>.fold-h .ch::before{content:"+"}
.fold.open>.fold-h .ch::before{content:"−"}
.fold:not(.open)>.fold-b{display:none}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 7px;border:1px solid var(--rule2);border-bottom-width:2px;border-radius:3px;background:#fff;font-size:13px;font-weight:700;color:var(--ink)}
.kc.dk{background:transparent;color:#fff;border-color:#6A6C72}
.spin{display:inline-block;flex:none;width:18px;height:18px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
.spin.lg{width:30px;height:30px;border-width:3px}
.spin.inv{border-color:#45464C;border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.meter{height:4px;background:var(--rule);position:relative}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.meter.full>i{background:var(--red)}
.bdg{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;font-size:13px;font-weight:700;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.gt{display:inline-flex;align-items:center;height:24px;padding:0 8px;font-size:13px;font-weight:700;color:#fff;border-radius:1px;white-space:nowrap}
.av{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--ink);border-radius:2px}
.av.s{width:32px;height:32px;font-size:14px}
.sw{width:24px;height:24px;border-radius:2px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;flex:none}
.sw.me{outline:2px solid var(--ink);outline-offset:2px}
.sw.taken{cursor:default;font-size:11px;font-weight:700;color:var(--ink);border-color:transparent}
.sw.asis{background:#fff;font-size:11px;color:var(--mute);font-weight:700}
.sws{display:flex;gap:5px;flex-wrap:wrap}
.cf .cf-ask{display:none}
.cf.ask>.cf-btn{display:none}
.cf.ask .cf-ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cf-ask b{font-size:15px}
.toast{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:#fff;display:flex;align-items:center;gap:24px;padding:0 0 0 20px;height:52px;font-size:15px;z-index:50;min-width:420px}
.toast button{height:52px;padding:0 20px;background:none;border:0;border-left:1px solid #3A3B40;color:var(--acc);font-weight:700}
.toast i{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);animation:shrink 6s linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}

/* home */
.hdr{height:64px;background:var(--ink);color:#fff;display:flex;align-items:stretch;padding:0 64px;gap:48px;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.tabs{display:flex;gap:30px}
.tab{display:flex;align-items:center;font-size:16px;font-weight:700;color:#BFC1C6;background:none;border:0;border-bottom:4px solid transparent;padding-top:4px}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--acc)}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:14px;color:#BFC1C6}
.home{position:absolute;inset:0;display:flex;flex-direction:column}
.sub{height:52px;flex:none;display:flex;align-items:center;gap:18px;padding:0 64px;border-bottom:1px solid var(--rule);background:#fff;font-size:15px}
.body{flex:1;padding:36px 64px 0;display:grid;grid-template-columns:1fr 432px;gap:72px;align-content:start;position:relative}
.strip{display:flex;align-items:center;gap:20px;padding:12px 18px;background:#fff;border-left:6px solid var(--ink);font-size:15px;line-height:1.4}
.strip.err{border-left-color:var(--red)}
.strip.acc{border-left-color:var(--acc)}
.strip .grow{min-width:0}
.thead{display:grid;align-items:end;height:28px;border-bottom:1px solid var(--ink);gap:16px}
.srow{display:grid;grid-template-columns:20px 1fr 196px 100px 36px;align-items:center;gap:16px;height:76px;border-bottom:1px solid var(--rule)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule2)}
.dot.on{background:var(--green);border-color:var(--green)}
.st{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sd{font-size:14px;color:var(--mute);margin-top:3px}
.rrow{display:grid;grid-template-columns:40px 1fr 110px 128px 120px;gap:18px;align-items:center;height:64px;border-bottom:1px solid var(--rule)}
.rrow.own{background:var(--acct);box-shadow:inset 6px 0 0 var(--acc);margin:0 -16px;padding:0 16px 0 22px}
.rc{font-size:18px;font-weight:700;text-align:right}
.empty{display:flex;align-items:center;gap:20px;padding:40px 0;font-size:18px;color:var(--ink2);border-bottom:1px solid var(--rule)}
.tiles{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.tile{background:#fff;border:0;border-top:4px solid var(--g);text-align:left;padding:8px 10px 9px;height:70px;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{background:var(--ink);color:#fff}
.tile b{font-size:14px;line-height:1.15}
.tile span{font-size:12px;color:var(--mute)}
.tile:hover span{color:#C9CBD0}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px;align-items:start}
.sec+.sec{margin-top:26px}
.krow{display:grid;grid-template-columns:88px 1fr auto;align-items:center;min-height:40px;border-bottom:1px solid var(--rule);font-size:15px;gap:8px}
.krow .kcs{display:flex;gap:4px;flex-wrap:wrap}
.krow.wait{background:var(--acct)}
.krow.wait .kcs{font-size:13px;font-weight:700}
.dlg-scrim{position:absolute;inset:0;background:rgba(17,18,20,.5);z-index:20}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:540px;background:#fff;z-index:21;border-top:6px solid var(--ink);padding:28px 32px 30px}

/* world */
.world{position:absolute;inset:0;background:#CADDE9;overflow:hidden}
.w-hill{position:absolute;left:0;right:0;top:290px;height:140px;background:#B5CFBE;clip-path:polygon(0 62%,10% 34%,24% 58%,38% 22%,52% 52%,67% 28%,82% 56%,100% 36%,100% 100%,0 100%)}
.w-gnd{position:absolute;left:0;right:0;top:420px;bottom:0;background:#C6D9BA}
.w-course{position:absolute;left:0;right:0;top:420px;bottom:0;background:#F0E7D3;clip-path:polygon(43.75% 0,56.25% 0,90% 100%,10% 100%)}
.w-course b{position:absolute;left:0;right:0;background:#E3D6B8}
.w-o{position:absolute}
.w-plaza{position:absolute;border-radius:50%;background:#EEE5D0;border-bottom:18px solid #D5C9AC}
.bean{position:absolute;background:var(--c);border-radius:999px}
.bean i{position:absolute;left:20%;right:20%;top:19%;height:24%;background:#2A2C31;border-radius:999px}
.shd{position:absolute;border-radius:50%;background:rgba(40,60,40,.16)}
.tag{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-size:13px;font-weight:700;padding:3px 8px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tag i{width:9px;height:9px;border-radius:50%}
.pod{position:absolute;background:#FBFAF6;display:flex;justify-content:center;padding-top:22px;font-size:64px;font-weight:800;color:var(--ink)}
.pod::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;background:#E6E1D4}

/* hud */
.tower{position:absolute;left:24px;top:24px;width:360px;color:#fff;font-size:15px;z-index:2}
.tw-h{background:var(--hud);padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--g,var(--acc))}
.tw-h .t{font-weight:700;font-size:16px;white-space:nowrap}
.tw-h .m{color:var(--hm);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-r{display:grid;grid-template-columns:32px 1fr auto 44px 44px;align-items:center;gap:8px;height:32px;padding-right:10px;background:var(--hud);border-top:1px solid var(--hud3)}
.tw-r .pl{height:31px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--hud3)}
.tw-r .pl.g1{background:var(--gold);color:var(--ink)}
.tw-r .pl.g2{background:var(--silver);color:var(--ink)}
.tw-r .pl.g3{background:var(--bronze);color:var(--ink)}
.tw-r .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-r .ic{font-size:14px;white-space:nowrap;display:flex;gap:8px}
.tw-r .sc{text-align:right;font-weight:700}
.tw-r .pg{text-align:right;color:var(--hm);font-size:13px}
.tw-r.me{background:var(--acc);color:var(--ink)}
.tw-r.me .pg{color:#4A3B00}
.tw-r.me .pl:not(.g1):not(.g2):not(.g3){background:#E5B000;color:var(--ink)}
.tw-r.dim .nm,.tw-r.dim .sc{color:#8E9198;font-weight:400}
.bell{color:#5BD394;font-weight:700}
.tw-r.me .bell{color:#0B5E2E}
.net{margin-top:6px;display:inline-flex;gap:8px;background:var(--hud);color:#D6D8DC;font-size:13px;padding:5px 10px}
.netnote{margin-top:6px;background:#fff;color:var(--ink);font-size:13px;line-height:1.4;padding:9px 12px;border-left:4px solid var(--acc)}
.tm{position:absolute;left:50%;top:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}
.tm-p{background:var(--hud);color:#fff;width:184px;text-align:center;padding:9px 0 12px}
.tm-v{font-size:50px;font-weight:700;line-height:1;letter-spacing:-.02em;display:inline-block}
.tm-bar{height:4px;margin:9px 16px 0;background:var(--hud3)}
.tm-bar i{display:block;height:100%;background:#fff}
.tm-p.warn{background:var(--red)}
.tm-p.warn .tm-bar{background:#8A0F13}
.tm-p.warn .tm-v{animation:pulse 1s ease-out infinite}
@keyframes pulse{0%{transform:scale(1.14)}35%{transform:scale(1)}}
.pills{display:flex;gap:6px}
.pill{background:#fff;color:var(--ink);height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap}
.pill .muted{font-weight:400}
.feed{position:absolute;right:24px;top:24px;width:480px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:2}
.fl{background:var(--hud);color:#fff;font-size:15px;padding:6px 12px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.fl .c{color:var(--hm)}
.fl.out{box-shadow:inset 4px 0 0 #FF5A52;padding-left:14px}
.fl.out .c{color:#FF8A84}
.fl b{font-weight:700}
.chat{position:absolute;left:24px;bottom:24px;width:560px;z-index:3}
.chat-h{background:var(--hud);color:#fff;padding:10px 14px;font-size:15px;display:flex;flex-direction:column;gap:5px}
.chat-h .sv{color:var(--hm)}
.chat-i{display:flex;align-items:center;background:#fff;height:46px;border:2px solid var(--ink);padding-right:12px}
.chat-i input{flex:1;border:0;height:100%;padding:0 12px;font-size:15px;background:none;outline:0}
.prompt{position:absolute;left:50%;top:600px;transform:translateX(-50%);background:#fff;color:var(--ink);text-align:center;padding:16px 28px;z-index:3;border-top:4px solid var(--ink)}
.prompt b{display:block;font-size:20px}
.status{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.status .big{font-size:26px;font-weight:700;padding:10px 26px;background:var(--hud);color:#fff}
.status .big.red{background:var(--red)}
.status .big.acc{background:var(--acc);color:var(--ink)}
.camsw{display:flex;align-items:stretch;background:#fff;height:40px;font-size:16px}
.camsw button{width:40px;border:0;background:var(--paper2);font-size:18px;font-weight:700}
.camsw button:hover{background:var(--ink);color:#fff}
.camsw span{padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:700}
.hint{background:var(--hud);color:#D6D8DC;font-size:13px;padding:5px 10px}
.esc-scrim{position:absolute;inset:0;background:rgba(17,18,20,.42);z-index:4}
.esc-scrim~.tower,.tower:has(~.esc-scrim){z-index:6}
.esc{position:absolute;left:400px;top:24px;width:1176px;height:852px;background:var(--paper);display:flex;flex-direction:column;z-index:5}
.esc.mid{width:860px}
.esc.small{left:460px;top:180px;width:700px;height:auto}
.esc-tabs{height:56px;flex:none;background:var(--ink);display:flex;padding:0 28px;gap:30px}
.esc-x{margin-left:auto;display:flex;align-items:center;gap:8px;color:#BFC1C6;font-size:14px}
.esc-body{flex:1;padding:24px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px;align-content:start;min-height:0}
.esc-body.one{display:block}
.phase{grid-column:1/-1;display:flex;align-items:center;gap:16px;background:#fff;padding:12px 16px;border-left:6px solid var(--ink);font-size:17px}
.rt{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.pinline{display:none;font-size:15px;background:#fff;padding:10px 12px;margin:6px 0 2px}
.pinline b{font-size:20px;letter-spacing:.12em;margin-left:4px}
.scope.priv .pinline{display:block}
.scope:not(.priv) .lock{display:none}
.scope.fill .bot-x,.scope.fill .addbot{display:none}
.scope.custom .rounds{display:none}
.scope:not(.custom) .maplist{display:none}
.prow{display:grid;grid-template-columns:32px 1fr auto auto;gap:10px;align-items:center;height:45px;border-bottom:1px solid var(--rule)}
.prow.me{background:var(--acct);box-shadow:inset 4px 0 0 var(--acc);padding-left:8px;margin-left:-8px}
.prow .n{font-size:15px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .s{font-size:13px;color:var(--mute)}
.prow .b{font-size:14px;white-space:nowrap;display:flex;gap:8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mchip{height:30px;border:1px solid var(--rule2);background:#fff;border-radius:2px;font-size:13px;font-weight:700;text-align:left;padding:0 8px;box-shadow:inset 3px 0 0 var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip:hover{border-color:var(--ink)}
.mchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ofit .lab2{margin:12px 0 6px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;margin-top:8px;font-size:14px;font-weight:700}
.crow .sw{width:20px;height:20px}
.crow .sws{gap:4px}

.panel{position:absolute;background:#fff;color:var(--ink);z-index:3}

.rtab{width:100%;border-collapse:collapse;font-size:16px}

.rtab td{padding:0 8px;height:46px;border-bottom:1px solid var(--rule)}
.rtab tr.me td{background:var(--acct)}
.rtab tr.me td:first-child{box-shadow:inset 5px 0 0 var(--acc)}
.rtab .r{text-align:right}
.pb{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;font-weight:700;background:var(--paper2)}
.pb.g1{background:var(--gold)}.pb.g2{background:var(--silver)}.pb.g3{background:var(--bronze)}
.plus{color:var(--green);font-weight:700}
.minus{color:var(--red);font-weight:700}
.dl{font-size:13px;font-weight:700}
.dl.up{color:var(--green)}.dl.dn{color:var(--red)}.dl.eq{color:var(--mute)}
.tot{font-size:20px;font-weight:700}
.intro{position:absolute;left:64px;bottom:72px;width:780px;background:#fff;z-index:3}
.intro .top{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;height:48px;padding:0 0 0 0;font-size:17px;font-weight:700}
.intro .top .gt{height:48px;padding:0 18px;font-size:16px}
.intro .top .sta{margin-left:auto;background:var(--acc);color:var(--ink);height:48px;display:flex;align-items:center;padding:0 20px}
.cd{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:3;background:var(--ink);color:#fff;width:260px;height:260px;display:flex;align-items:center;justify-content:center;font-size:200px;font-weight:800;line-height:1}
.cd span{animation:pop .35s ease-out}
.cd.go{width:auto;height:200px;padding:0 64px;background:var(--acc);color:var(--ink);font-size:132px;letter-spacing:-.02em}
@keyframes pop{from{transform:scale(1.25);opacity:.2}}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.aw{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:center}
.aw .e{font-size:20px;grid-row:span 2}
.aw b{font-size:15px}
.aw span{font-size:13px;color:var(--mute)}
.podl{position:absolute;transform:translateX(-50%);top:792px;background:var(--ink);color:#fff;font-size:15px;display:flex;align-items:center;z-index:2;white-space:nowrap}
.podl .pb{height:34px;width:34px;color:var(--ink)}
.podl span{padding:0 12px;font-weight:700}
.podl em{font-style:normal;padding:0 12px;background:var(--hud3);height:34px;display:flex;align-items:center;font-weight:700}
.away{position:absolute;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center}
.card{width:620px;background:#fff;border-top:6px solid var(--ink);padding:36px 40px 36px}
.load{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center}
.bar{height:6px;background:var(--rule);width:520px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}

 ['rooms','Комнаты',[['list','список'],['loading','загрузка'],['empty','пусто'],['pin','PIN'],['pinerr','PIN: ошибка'],['own','своя комната есть'],['refused','отказ сервера']]],

 ['lobby','Лобби',[['host','хост'],['guest','не хост'],['custom','свой список'],['outfit','наряд'],['running','идёт игра'],['practice','тренировка'],['settings','вкладка Настройки'],['dev','вкладка Dev']]],
 ['hud','Раунд HUD',[['chat','гонка + чат'],['last10','последние 10 с'],['mouse','мышь свободна'],['points','очки + WebSocket']]],

 ['results','Итоги раунда',[['next','между раундами'],['practice','тренировка'],['last','последний раунд']]],

function tower(head,rows,kind){
 const g=head.g?`style="--g:${head.g}"`:'';
 return `<div class="tower"><div class="tw-h" ${g}>${head.tag||''}<span class="t">${head.t}</span><span class="m">${head.m||''}</span></div>${rows.map((r,i)=>{

 {t:'Бобовый двор',a:'192.168.1.10',st:'on',d:'игроков: 11 · комнат: 3'},

 if(st=='gpu')notices.push(`<div class="strip err"><div class="grow">В прошлый раз видеокарта перестала отвечать (сброс видеодрайвера), и игра закрылась. Обновите драйвер; если повторится — выберите в «Графике» другое масштабирование. Отчёт: <b>${LOGS}/crash-2026-10-09-2114.txt</b></div><button class="btn">Открыть папку с логами</button></div>`);

 <p class="note mt12">Порт нужен, только если сервер слушает HTTP не на 5887: 192.168.1.10:7000.</p></div></div></div>`;

function rooms(st){
 const own=st=='own';
 const list=own?[{t:'Вечерний забег',h:0,run:1,n:7,b:2},...ROOMS]:ROOMS;
 let body;
 if(st=='loading')body=`<div class="empty">${spin('lg')}<span>Загружаем список…</span></div>`;
 else if(st=='empty')body=`<div class="empty"><svg width="36" height="44" viewBox="0 0 36 44" fill="none" stroke="#111214" stroke-width="2"><path d="M4 42V3h28v39M1 42h34"/><circle cx="25" cy="23" r="1.6" fill="#111214"/></svg><span>Пока нет ни одной комнаты — создайте свою.</span></div>`;
 else body=`<div class="thead cap" style="grid-template-columns:40px 1fr 110px 128px 120px;gap:18px"><span></span><span>Комната</span><span style="text-align:right">Игроки</span></div>${list.map((r,i)=>rrow(r,own&&i==0)).join('')}`;
 const cap=(st=='loading'||st=='empty')?'Комнаты':`Комнаты: ${list.length}`;
 const side=own?`${h2('Своя комната')}<button class="btn pri lg wide" data-go="lobby/host">Вернуться в свою комнату</button><p class="note mt12">Своя комната у каждого одна. Пока вас нет, хостом в ней кто-то из оставшихся; вернётесь — роль снова ваша.</p>`
 :`${h2('Своя комната')}<input class="inp" maxlength="24" placeholder="Комната Kauri"><div class="mt8">${tgl('Приватная: вход по PIN-коду (вы увидите его в меню комнаты)',false)}</div><button class="btn pri wide mt8" data-go="lobby/host">Создать комнату</button>`;
 const dlg=(st=='pin'||st=='pinerr')?`<div class="dlg-scrim" data-go="rooms/list"></div><div class="dlg"><div style="font-size:22px;font-weight:700;line-height:1.25">🔒 Комната закрыта PIN-кодом «Только свои»</div><div class="field mt24"><input class="inp${st=='pinerr'?' bad':''}" style="height:52px;font-size:24px;letter-spacing:.3em;max-width:200px" maxlength="4" inputmode="numeric" placeholder="PIN-код" value="${st=='pinerr'?'1234':''}"><button class="btn pri" style="height:52px" data-go="lobby/guest">Войти</button><button class="btn" style="height:52px" data-go="rooms/list">Отмена</button></div>${st=='pinerr'?'<div class="errt">Неверный PIN-код.</div>':'<p class="note mt12">PIN-код спросите у хоста комнаты.</p>'}</div>`:'';
 return `<div class="home">${hdr([['Комнаты','rooms/list'],['Настройки','settings/main']],'Комнаты')}
 <div class="sub"><button class="btn txt" data-go="servers/list">‹ К серверам</button><span class="muted">Бобовый двор · 192.168.1.10</span></div>
 ${st=='refused'?`<div class="strip err" style="margin:20px 64px 0">Сервер: комната «Финальный забег» заполнена, войти нельзя.</div>`:''}
 <div class="body" style="padding-top:${st=='refused'?20:30}px"><div><div class="h1" style="font-size:36px;margin-bottom:18px">${cap}</div>${body}</div>
 <div><div style="height:54px"></div>${side}<div class="mt24">${h2('Ваше имя')}<div class="field"><input class="inp" maxlength="16" value="Kauri"><button class="btn">Сохранить</button></div></div></div></div>
 <div style="padding:0 64px 28px" class="fold open"><div class="h2 fold-h" style="margin-bottom:12px">Тренировка одной карты с ботами<span class="aux">против трёх ботов</span><span class="ch"></span></div><div class="fold-b tiles">${MAPS.map(m=>`<button class="tile" style="--g:${G[m[1]][1]}" data-go="lobby/practice"><b>${m[0]}</b><span>${G[m[1]][0]}</span></button>`).join('')}</div></div>
 ${dlg}</div>`;
}

/* lobby / esc menu */
let lastGame='host';
function escPanel(tab,body,cls='',scope=''){
 const tabs=[['Игра','lobby/'+lastGame],['Настройки','lobby/settings'],['Dev','lobby/dev']];
 return `<div class="esc-scrim"></div><div class="esc scope ${cls} ${scope}"><div class="esc-tabs">${tabs.map(([t,g])=>`<button class="tab${t==tab?' on':''}" data-go="${g}">${t}</button>`).join('')}<div class="esc-x"><span class="kc dk">Esc</span>вернуться в игру</div></div>${body}</div>`;
}
function prow(i,o){
 const p=P[i],me=i==0;
 const sub=p.bot?'бот':p.dc?'<span class="red">нет связи</span>':p.ping+' мс';
 const b=(i==o.host?'<span>⭐</span>':'')+(p.cr?`<span>👑 ${p.cr}</span>`:'');
 let act='';
 if(o.isHost&&!me){act=p.bot?'<button class="btn x sm bot-x" data-kick title="Убрать бота">×</button>':p.dc?'':'<button class="btn sm">Сделать хостом</button>';}
 return `<div class="prow${me?' me':''}" data-p="${p.n}">${av(p,'s')}<div style="min-width:0"><div class="n">${p.n}${me?' (вы)':''}</div><div class="s">${sub}</div></div><div class="b">${b}</div><div>${act}</div></div>`;
}

  const rows=[R(3,{ic:'<span class="bell">3</span>',sc:14}),R(1,{ic:'<span class="bell">2</span>',sc:11}),R(0,{host:1,ic:'<span class="bell">1</span>',sc:9}),R(2,{sc:7}),R(5,{sc:5}),R(6,{sc:4}),R(4,{sc:2}),R(7,{sc:0,dim:1,ic:'👁'})];

  +timer('1:05',54,false,'<span class="pill">Звёзд на поле: <b>14</b></span><span class="pill">🍄 Великан · 9 с</span>')

 }
 const warn=st=='last10';
 let h=world('course',COURSE)+standingsWithNet(raceHead(),raceRows(),'round',net())
  +timer(warn?'0:07':'1:42',warn?6:68,warn,`<span class="pill">Открыто дверей: <b>3 из 5</b></span>${warn?'':'<span class="pill">⚡ Ускорение · 4 с</span>'}`)+raceFeed();

 if(st=='last10')h+=`<div class="chat" style="width:520px"><div class="chat-h"><div><b style="color:#4B93DB">Миша_К:</b> давай, 7 секунд!</div></div></div>`;
 if(st=='mouse')h+=`<div class="prompt"><b>🖱 Щёлкните по полю, чтобы вернуть управление</b><span class="muted">или нажмите Esc для меню</span></div>`;

}
function results(st){
 const prac=st=='practice',last=st=='last';
 const rows=prac?[[6,'до конца раунда','+3',0,'=',3],[0,'в игре 92 с','+2',0,'=',2],[5,'в игре 74 с','+1',0,'=',1],[8,'в игре 51 с','+0',0,'=',0]]
 :[[1,'финиш за 0:38.4','+10',0,'▲1',last?42:18],[2,'финиш за 0:41.0','+8',0,'▼1',last?38:16],[0,'финиш за 0:43.7','+6',0,'▲2',last?35:13],[3,'финиш за 0:45.2','+5','−2','=',last?27:9],[5,'финиш за 0:51.9','+4',0,'▼1',last?19:8],[6,'без финиша','+0',0,'▲1',last?12:7],[4,'без финиша','+0',0,'▼2',last?15:6],[7,'без финиша','+0',0,'=',last?6:2]];
 const cap=prac?'тренировка':last?'итоги раунда 5 из 5':'итоги раунда 2 из 5';
 const map=prac?'Хекс-а-гон':last?'Ледяные небеса':'Молоты и качели';
 const nxt=prac?'Заново через':last?'Итоги игры через':'Следующий раунд через';
 const g=prac?'var(--surv)':'var(--race)';
 return world(prac?'arena':'course',prac?[]:COURSE.slice(1))+`<div class="panel" style="left:400px;top:70px;width:800px"><div class="p-h" style="box-shadow:inset 0 -4px 0 ${g}"><div><div style="color:var(--hm);font-size:15px;font-weight:700">${cap}</div><div style="font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px">${map}</div></div><div class="grow"></div><div style="text-align:right"><div style="font-size:15px;color:#D6D8DC">${nxt} <b style="color:#fff;font-size:22px">8 с</b></div><div class="tm-bar" style="width:220px;margin:8px 0 0 auto"><i style="width:60%"></i></div></div></div>
 <div style="padding:6px 24px 18px"><table class="rtab"><tr><th style="width:52px">Место</th><th>Игрок</th><th class="r">Раунд</th><th class="r">Штраф</th><th class="r" style="width:60px">±</th><th class="r" style="width:80px">Всего</th></tr>
 ${rows.map((r,i)=>{const p=P[r[0]];return `<tr class="${r[0]==0?'me':''}"><td><span class="pb${i<3?' g'+(i+1):''}">${i+1}</span></td><td><b>${p.n}</b>${p.bot?' <span class="muted">бот</span>':''} <span class="muted" style="margin-left:10px;font-size:14px">${r[1]}</span></td><td class="r ${r[2]=='+0'?'muted':'plus'}">${r[2]}</td><td class="r minus">${r[3]||''}</td><td class="r"><span class="dl ${r[4][0]=='▲'?'up':r[4][0]=='▼'?'dn':'eq'}">${r[4]=='='?'—':r[4]}</span></td><td class="r tot">${r[5]}</td></tr>`}).join('')}</table></div></div>`;
}
function spectate(st){
 const camName=st=='spectator'?null:'lena.v';
 let h=world('course',COURSE.slice(1))+standingsWithNet(raceHead(),raceRows().map(r=>{if(st=='out'&&r[0]==0){r.ic='✖';r.dim=1}if(st=='finish'&&r[0]==0){r.ic='🏁3';r.sc=6}if(st=='spectator'&&r[0]==0){r.ic='👁'}return r}),'round',net())+timer('0:54',36,false,'<span class="pill">Открыто дверей: <b>4 из 5</b></span>')+raceFeed();
 const big=st=='out'?'<div class="big red">Вы выбыли</div>':st=='finish'?'<div class="big acc">🏁 Финиш: 3-е место!</div>':'<div class="big">👁 Вы зритель</div>';
 h+=`<div class="status">${big}<div class="camsw"><button title="предыдущий">‹</button><span>${camName?`<i style="width:10px;height:10px;border-radius:50%;background:#43C28F;display:inline-block"></i>Камера: ${camName}`:'Камера: обзор арены'}</span><button title="следующий">›</button></div><div class="hint">ЛКМ/ПКМ или A/D — сменить игрока</div></div>`;
 return h;
}
function summary(st){
 const win=st=='win';
 const order=win?[0,1,2,3,5,4,6,7]:[1,2,0,3,5,4,6,7];
 const tot=[42,38,35,27,19,15,12,6],wins=[2,1,1,1,0,0,0,0];
 const pod=[[1,320,560,170],[0,520,500,230],[2,720,610,120]];
 let ex='';
 pod.forEach(([k,x,y,hh])=>{ex+=`<div class="pod" style="left:${x-100}px;top:${y}px;width:200px;height:${780-y}px">${k+1}</div>`;});
 const bs=pod.map(([k,x,y])=>[x,y-4,k==0?74:62,order[k],1]);
 let h=world('lobby',[],{extra:ex+bs.map(([x,y,w,i])=>bean(x,y,w,P[i].c,1)).join('')+pod.map(([k,x])=>`<div class="podl" style="left:${x}px"><span class="pb g${k+1}">${k+1}</span><span>${P[order[k]].n}</span><em>${tot[k]}</em></div>`).join('')});
 h+=`<div class="panel" style="left:900px;top:24px;width:676px"><div class="p-h" style="flex-direction:column;align-items:stretch;gap:6px;box-shadow:inset 0 -4px 0 var(--acc)"><div style="color:var(--hm);font-size:15px;font-weight:700;display:flex">Итоги игры<span class="grow"></span><span style="font-weight:400;color:#D6D8DC">Возврат в лобби через <b style="color:#fff">14 с</b></span></div><div style="font-size:40px;font-weight:800;letter-spacing:-.02em">${win?'👑 Вы победили!':'👑 Миша_К побеждает!'}</div></div>
 <div style="padding:14px 24px 0"><div class="h2" style="font-size:17px;margin-bottom:0;border-bottom-width:1px">Итоговая таблица</div><table class="rtab" style="font-size:15px">${order.map((i,k)=>`<tr class="${i==0?'me':''}"><td style="width:46px;height:34px"><span class="pb${k<3?' g'+(k+1):''}" style="width:26px;height:26px">${k+1}</span></td><td style="height:34px"><b>${P[i].n}</b>${P[i].bot?' <span class="muted">бот</span>':''}</td><td class="r" style="height:34px">${wins[k]?'🏆'+wins[k]:''}</td><td class="r tot" style="height:34px;width:70px;font-size:17px">${tot[k]}</td></tr>`).join('')}</table></div>
 <div style="padding:18px 24px 0"><div class="h2" style="font-size:17px;margin-bottom:0;border-bottom-width:1px">Награды</div><div class="awards" style="padding-bottom:20px">
 ${[['⚡','Молния',win?'Kauri':'lena.v','лучшие места в гонках'],['🛡️','Несокрушимость','Kauri','212 с в игре'],['💥','Задира','Миша_К','14 сбитых соперников'],['🤲','Цепкие руки','Тёма','9 захватов'],['🍌','Неваляшка','nightowl','23 падений'],['🦊','Хитрая лиса','Тёма','5 срезок пути (и штрафы за них)']].map(a=>`<div class="aw"><span class="e">${a[0]}</span><b>${a[1]} · ${a[2]}</b><span>${a[3]}</span></div>`).join('')}</div></div></div>`;
 return h;
}
function banner(st){
 let c;
 const lg=`<div class="logo" style="font-size:28px;margin-bottom:22px">${logoMark(30,'var(--ink)')}Fall Beans</div>`;
 if(st=='connecting'||st=='reconnecting')c=`<div class="row gap16">${spin('lg')}<div style="font-size:26px;font-weight:700;letter-spacing:-.01em">${st=='connecting'?'Подключение…':'Связь потеряна — переподключаемся…'}</div></div><p class="muted mt12" style="padding-left:46px">Бобовый двор · 192.168.1.10</p><div class="mt24" style="padding-left:46px"><button class="btn" data-go="servers/list">Отмена</button></div>`;
 else if(st=='refused')c=`${lg}<div style="font-size:22px;font-weight:700;line-height:1.35">Сервер на обслуживании до 21:00. Заходите позже!</div><div class="row gap8 mt24"><button class="btn" data-go="servers/list">‹ К серверам</button><button class="btn pri">Выйти из игры</button></div>`;
 else{const u={outdated:`<div style="font-size:16px;font-weight:700">Вышла версия 0.3.1</div><div class="row gap8 mt12"><button class="btn pri">Скачать</button><button class="btn" data-go="servers/list">‹ К серверам</button></div>`,
 outdl:`<div style="font-size:16px;font-weight:700">Скачиваем обновление… 42%</div><div class="meter mt12"><i style="width:42%"></i></div><div class="row gap8 mt24"><button class="btn" data-go="servers/list">‹ К серверам</button></div>`,
 outfail:`<div class="red" style="font-size:16px;font-weight:700">Не удалось обновиться: сервер обновлений не ответил</div><div class="row gap8 mt12"><button class="btn pri">Попробовать снова</button><button class="btn">Страница релиза</button><button class="btn txt" style="margin-left:12px" data-go="servers/list">‹ К серверам</button></div>`}[st];
 c=`${lg}<div style="font-size:22px;font-weight:700;line-height:1.35">Эта версия игры устарела: скачайте новую.</div><div class="mt16" style="border-top:1px solid var(--rule);padding-top:16px">${u}</div>`;}
 return `<div class="away"><div class="card">${c}</div></div>`;
}
function loading(st){
 const step={models:['Модели и текстуры',22],maps:['Карты: 9 из 17',55],shaders:['Шейдеры',84],regfx:['Шейдеры для новых настроек графики',40]}[st];
 return `<div class="load"><div class="logo" style="font-size:72px;gap:22px;letter-spacing:-.035em">${logoMark(80,'var(--ink)')}Fall Beans</div><div class="row gap12" style="margin-top:56px;font-size:20px;font-weight:700">${spin()}Загрузка…</div><div class="bar mt16"><i style="width:${step[1]}%"></i></div><div class="muted mt12" style="font-size:15px">${step[0]}</div></div>`;
}
const RENDER={loading,servers,rooms,settings,lobby,hud,intro,results,spectate,summary,banner};

/* ---------- router ---------- */
let timers=[];
function route(){
 timers.forEach(clearInterval);timers=[];
 let [s,t]=(location.hash.slice(1)||'servers/list').split('/');
 let sc=SCREENS.find(x=>x[0]==s)||SCREENS[1];
 let states=sc[2];
 let st=states.find(x=>x[0]==t)||states[+t]||states[0];
 document.getElementById('mS').innerHTML='<span class="lbl">screen</span>'+SCREENS.map(x=>`<button class="${x==sc?'on':''}" onclick="location.hash='${x[0]}/${x[2][0][0]}'">${x[1]}</button>`).join('');
 document.getElementById('mT').innerHTML='<span class="lbl">state</span>'+states.map(x=>`<button class="${x==st?'on':''}" onclick="location.hash='${sc[0]}/${x[0]}'">${x[1]}</button>`).join('');
 stage.innerHTML=RENDER[sc[0]](st[0]).replace(/(👁|🕳|🖱|⚔|🕶|🛡)(?!\uFE0F)/g,'$1\uFE0F');
 if(sc[0]=='hud'&&st[0]=='last10'){let n=7;timers.push(setInterval(()=>{n=n<=1?9:n-1;const e=document.getElementById('tmv');if(e){e.textContent='0:0'+n;e.style.animation='none';e.offsetWidth;e.style.animation='';}},1000));}
 if(sc[0]=='intro'&&st[0]=='card'){let n=7;timers.push(setInterval(()=>{n=n<=1?7:n-1;const e=document.getElementById('introN');if(e)e.textContent=n},1000));}
 const ci=document.getElementById('chatin');if(ci)ci.focus({preventScroll:true});
}
function fit(){
 const vp=document.getElementById('vp'),w=vp.clientWidth,h=vp.clientHeight,s=Math.min(w/1600,h/900);
 stage.style.transform=`scale(${s})`;stage.style.left=(w-1600*s)/2+'px';stage.style.top=(h-900*s)/2+'px';
}
addEventListener('hashchange',route);addEventListener('resize',fit);

/* ---------- interactions ---------- */
let toastT;
function toast(msg,undo){
 stage.querySelectorAll('.toast').forEach(t=>t.remove());clearTimeout(toastT);
 const t=document.createElement('div');t.className='toast';t.innerHTML=`<span class="grow">${msg}</span>${undo?'<button>Вернуть</button>':''}<i></i>`;
 stage.appendChild(t);
 if(undo)t.querySelector('button').onclick=()=>{undo();t.remove()};
 toastT=setTimeout(()=>t.remove(),6000);
}
stage.addEventListener('click',e=>{
 const el=e.target;
 const go=el.closest('[data-go]');
 if(go&&!go.disabled){location.hash=go.dataset.go;return;}
 const fh=el.closest('.fold-h');if(fh){fh.parentElement.classList.toggle('open');return;}
 const tr=el.closest('.tgr');
 if(tr){const tg=tr.querySelector('.tg');tg.classList.toggle('on');const f=tr.dataset.flip;if(f)tr.closest('.scope').classList.toggle(f,tg.classList.contains('on'));return;}
 const md=el.closest('[data-mode]');
 if(md){md.closest('.scope').classList.toggle('custom',md.dataset.mode=='custom');}
 const ch=el.closest('.chip');
 if(ch&&!ch.disabled){ch.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));ch.classList.add('on');return;}
 const mc=el.closest('[data-map]');
 if(mc){const g=mc.parentElement;let on=[...g.querySelectorAll('.mchip.on')].sort((a,b)=>a.dataset.o-b.dataset.o);
  if(!g.dataset.init){on=[...g.querySelectorAll('.mchip.on')].sort((a,b)=>parseInt(a.textContent)-parseInt(b.textContent));g.dataset.init=1;}
  if(mc.classList.contains('on'))on=on.filter(x=>x!=mc);else if(on.length<12)on.push(mc);
  g.querySelectorAll('.mchip').forEach(x=>{x.classList.remove('on');x.textContent=x.dataset.map});
  on.forEach((x,i)=>{x.classList.add('on');x.dataset.o=i;x.textContent=(i+1)+'. '+x.dataset.map});
  document.getElementById('mcount').textContent=on.length+' из 12';return;}
 const sw=el.closest('.sw');
 if(sw&&!sw.disabled){sw.parentElement.querySelectorAll('.sw').forEach(s=>s.classList.remove('me'));sw.classList.add('me');return;}
 const cb=el.closest('.cf-btn');if(cb){cb.parentElement.classList.add('ask');return;}
 const no=el.closest('[data-no]');if(no){no.closest('.cf').classList.remove('ask');return;}
 const yes=el.closest('[data-yes]');if(yes){if(yes.dataset.yes)location.hash=yes.dataset.yes;return;}
 const rm=el.closest('[data-rm]');
 if(rm){const row=rm.closest('.srow');row.hidden=true;toast(`Сервер «${row.dataset.srv}» убран из списка`,()=>row.hidden=false);return;}
 const kk=el.closest('[data-kick]');
 if(kk){const row=kk.closest('.prow');row.hidden=true;toast(`Бот ${row.dataset.p} убран из комнаты`,()=>row.hidden=false);return;}
 if(el.closest('[data-resetfit]')){toast('Наряд сброшен',()=>{});return;}
 if(el.closest('[data-resetkeys]')){const box=document.getElementById('keys');const snap=box.innerHTML;box.querySelectorAll('.krow').forEach(r=>{r.classList.remove('wait');r.querySelector('.kcs').innerHTML=r.dataset.orig.split(',').map(x=>`<span class="kc">${x}</span>`).join('')});toast('Клавиши возвращены как было',()=>{box.innerHTML=snap});return;}
 const rb=el.closest('[data-rebind]');
 if(rb){const r=rb.closest('.krow');stage.querySelectorAll('.krow.wait').forEach(x=>{if(x!=r){x.classList.remove('wait');x.querySelector('.kcs').innerHTML=x.dataset.orig.split(',').map(k=>`<span class="kc">${k}</span>`).join('')}});r.classList.add('wait');r.querySelector('.kcs').textContent='Нажмите клавишу… (Esc — отмена)';return;}
 if(el.closest('[data-add]'))addServer();
});
stage.addEventListener('input',e=>{
 const i=e.target;
 if(i.type=='range'){const sl=i.parentElement,p=(i.value-i.min)/(i.max-i.min)*100;sl.style.setProperty('--p',p+'%');const v=sl.parentElement.querySelector('.v');v.textContent=fmt(i.value,+v.dataset.dec)+v.dataset.suf;}
 if(i.id=='chatin')document.getElementById('chatn').textContent=i.value.length+'/160';
 if(i.id=='addr'){i.classList.remove('bad');document.getElementById('addrerr').hidden=true;}
});
function addServer(){
 const i=document.getElementById('addr'),v=i.value.trim();
 if(!/^([a-z0-9-]+\.)+[a-z0-9-]+(:\d{1,5})?$|^localhost(:\d{1,5})?$|^\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?$/i.test(v)){i.classList.add('bad');document.getElementById('addrerr').hidden=false;return;}
 const box=document.getElementById('srvs');if(box){box.insertAdjacentHTML('beforeend',srow({t:v,a:v,st:'chk',d:''}));i.value='';}
}
addEventListener('keydown',e=>{
 const w=stage.querySelector('.krow.wait');
 if(w){e.preventDefault();const reserved=/^(F\d+|Digit[1-5]|Enter)$/.test(e.code);if(e.key=='Escape'||reserved){w.classList.remove('wait');w.querySelector('.kcs').innerHTML=w.dataset.orig.split(',').map(k=>`<span class="kc">${k}</span>`).join('');return;}
  const k=e.code.replace(/^Key|^Digit/,'').replace('ShiftLeft','Shift').replace('ControlLeft','Ctrl').replace('ArrowUp','↑').replace('ArrowDown','↓').replace('ArrowLeft','←').replace('ArrowRight','→');
  w.dataset.orig=k;w.classList.remove('wait');w.querySelector('.kcs').innerHTML=`<span class="kc">${k}</span>`;return;}
 if(e.key=='Enter'){
  if(e.target.id=='addr')addServer();
  if(e.target.id=='chatin'&&e.target.value.trim()){document.getElementById('chatlog').insertAdjacentHTML('beforeend',`<div><b style="color:#E8664A">Kauri:</b> ${e.target.value.replace(/</g,'&lt;')}</div>`);const l=document.getElementById('chatlog');while(l.children.length>8)l.firstChild.remove();e.target.value='';document.getElementById('chatn').textContent='0/160';}
 }
});
route();fit();
</script>
</body>
</html>
