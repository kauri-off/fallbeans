<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Fall Beans — A: Console clarity</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --f: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Ubuntu,Cantarell,sans-serif;
  --bg:#ECEEF2; --s:#FFFFFF; --s2:#F3F4F7; --n:#E3E6EB; --line:#D5D9E0;
  --ink:#161A21; --ink2:#4A5160; --ink3:#626A78;
  --brand:#2F54EB; --brand-d:#2343C8; --tint:#E9EEFF;
  --danger:#C92A2A; --dtint:#FDECEC; --ok:#1E7B34; --oktint:#E3F5E7; --warn:#8A4B00; --wtint:#FFF2DD;
  --race:#0B7285; --surv:#F08C00; --pts:#237A36;
  --gold:#F2C230; --silver:#CDD2DA; --bronze:#DFA06E;
  --bar:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1F2228;font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* mock bar */
#mock{position:fixed;left:0;right:0;top:0;height:var(--bar);background:#F2F2F2;border-bottom:1px solid #C8C8C8;z-index:10;
  font:12px/1 ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;color:#222;padding:4px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
#mock .r{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;height:26px}
#mock .r::-webkit-scrollbar{display:none}
#mock .lbl{color:#777;padding-right:4px;flex:none}
#mock button{flex:none;padding:5px 8px;border:1px solid #C4C4C4;background:#fff;border-radius:3px;font:inherit;white-space:nowrap}
#mock button.on{background:#222;color:#fff;border-color:#222}

#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0}

/* type scale: 14 16 20 24 32 48 64 160 */
.t14{font-size:14px}.t16{font-size:16px}.t20{font-size:20px}.t24{font-size:24px}.t32{font-size:32px}.t48{font-size:48px}.t64{font-size:64px}
.b{font-weight:700}.xb{font-weight:800}.mut{color:var(--ink2)}.num{font-variant-numeric:tabular-nums}
.red{color:var(--danger)}.grn{color:var(--ok)}
h1{font-size:32px;font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:20px;font-weight:700}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}.g32{gap:32px}
.grow{flex:1;min-width:0}.sp{justify-content:space-between}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* controls */
.btn{height:56px;padding:0 24px;border-radius:14px;font-size:20px;font-weight:700;background:var(--n);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none}
.btn:hover{background:#D8DCE3}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{background:var(--brand-d)}
.btn.d{background:var(--s);color:var(--danger);box-shadow:inset 0 0 0 2px #EDB4B4}
.btn.d:hover{background:var(--dtint)}
.btn.dd{background:var(--danger);color:#fff}
.btn.sm{height:40px;padding:0 16px;font-size:16px;border-radius:10px}
.btn.lg{height:64px;font-size:24px;border-radius:16px}
.btn.ic{width:56px;padding:0;font-size:24px}.btn.sm.ic{width:40px;font-size:20px}
.btn.w{width:100%}
.btn:disabled{background:var(--s2);color:var(--ink3);cursor:not-allowed;box-shadow:inset 0 0 0 2px var(--n)}
.f,button:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 3px #fff,0 0 0 7px var(--brand)!important}
.in{height:56px;border:2px solid #C9CED7;border-radius:14px;padding:0 16px;font-size:20px;font-weight:500;background:#fff;min-width:0}
.in::placeholder{color:#737B88}
.in:focus{outline:none;border-color:var(--brand)}
.in.err{border-color:var(--danger)}
.tog{width:56px;height:32px;border-radius:16px;background:#C2C8D1;position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--brand)}.tog.on::after{left:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 18px;border-radius:22px;background:var(--n);font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip:hover{background:#D8DCE3}
.chip.sel{background:var(--brand);color:#fff}
.chip:disabled{background:var(--s2);color:#8C93A0;cursor:not-allowed;text-decoration:line-through}
.chips.sm .chip{height:40px;padding:0 14px}
.chip .ord{display:inline-flex;min-width:24px;height:24px;border-radius:12px;background:#fff;color:var(--brand);font-size:14px;align-items:center;justify-content:center;padding:0 6px}
.sl{display:flex;align-items:center;gap:16px}
.sl input{-webkit-appearance:none;appearance:none;width:320px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brand) var(--p),#C9CED7 var(--p));outline:none}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--brand),0 1px 3px rgba(0,0,0,.25)}
.sl input:focus-visible::-webkit-slider-thumb{box-shadow:inset 0 0 0 3px var(--brand),0 0 0 4px #fff,0 0 0 8px var(--brand)}
.sl output{width:72px;height:40px;border-radius:10px;background:var(--s2);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sw{width:40px;height:40px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sw.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.sw:disabled{opacity:.28;cursor:not-allowed}
.sw svg{width:20px;height:20px}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:36px;padding:0 10px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px #C9CED7;font-size:16px;font-weight:700;white-space:nowrap}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid rgba(0,0,0,.14);border-top-color:var(--brand);animation:sp .8s linear infinite;flex:none}
.spin.lg{width:48px;height:48px;border-width:5px}
.spin.sm{width:14px;height:14px;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.meter{height:8px;border-radius:4px;background:var(--n);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:4px}
.meter.full i{background:var(--danger)}
.badge{height:28px;padding:0 12px;border-radius:14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bd-ok{background:var(--oktint);color:#17652A}.bd-bad{background:var(--dtint);color:#A61E1E}.bd-wait{background:var(--s2);color:var(--ink2)}.bd-warn{background:var(--wtint);color:var(--warn)}
.bd-live{background:var(--ink);color:#fff}
.gt{height:28px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;white-space:nowrap}
.g-race{background:var(--race);color:#fff}.g-surv{background:var(--surv);color:var(--ink)}.g-pts{background:var(--pts);color:#fff}.g-none{background:var(--ink);color:#fff}
.gdot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.av{width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;font-size:20px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.s{width:40px;height:40px;font-size:16px}
.av.xs{width:28px;height:28px;font-size:14px}
.card{background:var(--s);border-radius:20px;padding:24px}
.sec{background:var(--s2);border-radius:16px;padding:24px}
.svgi{width:24px;height:24px;flex:none}

/* home */
.home{background:var(--bg);display:flex;flex-direction:column}
.hbar{height:104px;padding:0 48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.logo{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.seg{display:flex;background:#DCE0E6;border-radius:999px;padding:6px;gap:4px}
.seg button{height:52px;padding:0 32px;border-radius:999px;font-size:20px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,24,33,.15)}
.hmain{flex:1;padding:0 48px 40px;display:grid;gap:32px;min-height:0}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--s);border-radius:18px;padding:20px 24px;display:flex;align-items:center;gap:20px;min-height:96px}
.item.own{background:var(--tint);box-shadow:inset 0 0 0 2px var(--brand)}
.item.f{box-shadow:0 0 0 3px var(--bg),0 0 0 7px var(--brand)!important}
.sdot{width:48px;height:48px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;flex:none}
.sdot i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 3px #A3AAB6}
.sdot.on i{background:#2FB344;box-shadow:none}
.note{border-radius:18px;padding:20px 24px;display:flex;gap:16px;align-items:flex-start}
.note.warn{background:var(--wtint)}
.note.bad{background:var(--dtint);color:#8F1B1B}
.empty{background:var(--s);border-radius:18px;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;color:var(--ink2)}
.empty svg{width:80px;height:80px}
.fold-h{width:100%;height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;border-radius:18px;background:var(--s)}
.fold-h .chev{transition:transform .15s}
.fold.open .fold-h .chev{transform:scaleY(-1)}
.fold-b{display:none}
.fold.open .fold-b{display:block}
.fold.open .fold-h{border-radius:18px 18px 0 0}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:var(--s);padding:0 24px 24px;border-radius:0 0 18px 18px}
.tile{height:76px;border-radius:12px;background:var(--s2);text-align:left;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{background:var(--n)}
.tile .ttl{font-size:16px;font-weight:700;line-height:1.1}
.tile .gn{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:6px}

/* settings */
.set{display:grid;grid-template-columns:340px 1fr;gap:32px;min-height:0;height:100%}
.snav{display:flex;flex-direction:column;gap:8px}
.snav button{height:64px;padding:0 24px;border-radius:16px;text-align:left;font-size:20px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:space-between}
.snav button:hover{background:#DFE2E8}
.snav button.on{background:var(--ink);color:#fff}
.spanel{background:var(--s);border-radius:20px;padding:8px 32px;overflow:hidden;align-self:start}
.spane{display:none}.spane.on{display:block}
.srow{min-height:76px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--n);padding:12px 0}
.srow:last-child{border-bottom:0}
.srow .lab{width:340px;flex:none;font-size:20px;font-weight:500}
.srow .ctl{flex:1;display:flex;align-items:center;gap:16px;justify-content:flex-end}
.srow.tg{cursor:pointer}
.srow.tg .lab{width:auto;flex:1}
.srow.info{min-height:56px;color:var(--ink2);font-size:16px}
.srow.rebind{background:var(--tint);margin:0 -32px;padding:12px 32px;border-bottom-color:transparent}
.saved{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}

/* world */
.world{position:absolute;inset:0;overflow:hidden;background:#CBE6F6}
.world .hill{position:absolute;border-radius:50%;background:#B4DCAE}
.world .gnd{position:absolute;left:0;right:0;top:470px;bottom:0;background:#A6D49F}
.world .course{position:absolute;left:0;right:0;top:400px;bottom:0;background:#FFF0C7;clip-path:polygon(45% 0,55% 0,96% 100%,4% 100%)}
.world .edge{position:absolute;left:0;right:0;top:400px;bottom:0;background:#F5C96B;clip-path:polygon(44.4% 0,45% 0,4% 100%,1% 100%,1% 100%)}
.world .edge.r{clip-path:polygon(55% 0,55.6% 0,99% 100%,96% 100%)}
.world .stripe{position:absolute;left:0;right:0;top:400px;bottom:0;background:#FBE3A6}
.world .cloud{position:absolute;height:44px;border-radius:22px;background:#fff}
.world .ob{position:absolute;border-radius:10px}
.bean{position:absolute;width:48px;height:68px;border-radius:24px 24px 20px 20px;background:var(--c);transform-origin:50% 100%}
.bean::after{content:"";position:absolute;left:10px;right:10px;top:14px;height:16px;border-radius:9px;background:#EAF3FA}
.bean.back::after{display:none}
.tag{position:absolute;transform:translateX(-50%);background:#fff;border-radius:14px;height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tag.far{opacity:.6}
.dim{position:absolute;inset:0;background:rgba(14,18,26,.42)}

/* HUD */
.hp{background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(15,20,30,.16)}
.stand{position:absolute;left:24px;top:24px;width:372px;padding:12px}
.stand .hd{padding:4px 4px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--n);margin-bottom:6px}
.stand .hd .l1{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.stand .hd .l2{font-size:20px;font-weight:800}
.sr{height:34px;display:flex;align-items:center;gap:8px;padding:0 6px;border-radius:9px;font-size:16px}
.sr.me{background:var(--tint)}
.sr.dim2{color:#7B8290}
.pl{width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.pl.p1{background:var(--gold);color:var(--ink)}.pl.p2{background:var(--silver);color:var(--ink)}.pl.p3{background:var(--bronze);color:var(--ink)}
.sr .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .st{width:40px;text-align:center;font-size:14px;font-weight:700}
.sr .sc{width:32px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sr .pg{width:56px;text-align:right;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sr.dim2 .pg{color:#7B8290}
.net{position:absolute;left:24px;height:32px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.timer{position:absolute;left:50%;top:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.tbox{width:168px;height:72px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
.tbox .tv{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin-top:-4px}
.tbox .tb{position:absolute;left:12px;right:12px;bottom:8px;height:6px;border-radius:3px;background:var(--n)}
.tbox .tb i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.tbox.low{background:#E03131;color:#fff;animation:pulse 1s ease-out infinite}
.tbox.low .tb{background:rgba(255,255,255,.35)}.tbox.low .tb i{background:#fff}
@keyframes pulse{0%{transform:scale(1.08)}35%{transform:scale(1)}}
.pill{height:36px;padding:0 14px;border-radius:12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.feed{position:absolute;right:24px;top:24px;width:460px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.fl{padding:7px 12px;border-radius:10px;font-size:16px;line-height:1.35;background:#fff;box-shadow:0 1px 4px rgba(15,20,30,.16);max-width:100%}
.fl b{font-weight:800}
.fl.out{color:var(--danger)}
.fl .cd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.chat{position:absolute;left:24px;bottom:24px;width:540px;display:flex;flex-direction:column;gap:6px}
.chat.open{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 6px rgba(15,20,30,.16)}
.cl{font-size:16px;line-height:1.35;padding:4px 8px;border-radius:8px}
.chat:not(.open) .cl{background:#fff;align-self:flex-start;box-shadow:0 1px 4px rgba(15,20,30,.16)}
.cl b{font-weight:800}
.cl .cd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.cl.sys{color:var(--ink2)}
.chat .in{height:48px;font-size:16px;margin-top:6px;border-color:var(--brand)}
.center{position:absolute;left:50%;transform:translateX(-50%)}

/* esc menu */
.menu{position:absolute;left:64px;top:40px;width:1472px;height:820px;background:#fff;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(10,14,22,.3)}
.menu.narrow{left:400px;width:800px;height:auto;top:180px}
.mtabs{height:88px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--n);flex:none}
.mbody{flex:1;padding:24px 32px 32px;min-height:0}
.mpane{display:none;height:100%}.mpane.on{display:block}
.lob{display:grid;grid-template-columns:392px 412px 1fr;gap:24px;height:100%}
.prow{height:60px;display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:12px}
.prow:hover,.prow.f{background:#fff}
.prow .act{display:none;gap:8px}
.host .prow:hover .act,.host .prow.f .act{display:flex}
.host .prow:hover .bdg,.host .prow.f .bdg{display:none}
.prow.f{box-shadow:inset 0 0 0 3px var(--brand)!important}
.confirm{display:flex;align-items:center;gap:12px;background:var(--dtint);border-radius:14px;padding:8px 8px 8px 16px}
.confirm span{flex:1;font-size:16px;font-weight:700;color:#8F1B1B}

/* overlays */
.toast{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;height:64px;padding:0 12px 0 24px;display:flex;align-items:center;gap:24px;font-size:20px;font-weight:700;z-index:50}
.toast .btn{background:#fff;color:var(--ink);height:44px;font-size:16px}
.modal{position:absolute;inset:0;background:rgba(14,18,26,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.dialog{background:#fff;border-radius:24px;padding:40px;width:640px;display:flex;flex-direction:column;gap:24px;box-shadow:0 8px 32px rgba(10,14,22,.3)}
.pin{display:flex;gap:12px}
.pin input{width:72px;height:88px;border:2px solid #C9CED7;border-radius:16px;text-align:center;font-size:48px;font-weight:800;background:#fff}
.pin input:focus{outline:none;border-color:var(--brand)}
.pin.err input{border-color:var(--danger)}
.away{background:var(--bg);display:flex;align-items:center;justify-content:center}
.bcard{width:720px;background:#fff;border-radius:28px;padding:48px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.load{background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
.load .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff}
.lbar{width:560px;height:12px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden}
.lbar i{display:block;height:100%;background:#fff;border-radius:6px}
.updbox{background:#fff;border-radius:18px;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.pbar{height:10px;border-radius:5px;background:var(--n);overflow:hidden}.pbar i{display:block;height:100%;background:var(--brand)}
table{border-collapse:collapse}
.rt td{height:52px;font-size:20px;padding:0 8px;border-bottom:1px solid var(--n)}
.rt tr:last-child td{border-bottom:0}
.rt tr.me td{background:var(--tint)}
.rt tr.me td:first-child{border-radius:12px 0 0 12px}.rt tr.me td:last-child{border-radius:0 12px 12px 0}
.dlt{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:48px;height:28px;border-radius:8px;font-size:14px;font-weight:800;background:var(--s2);color:var(--ink2)}
.dlt.up{background:var(--oktint);color:#17652A}.dlt.dn{background:var(--dtint);color:#A61E1E}
.award{background:var(--s2);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.award .em{font-size:32px;line-height:1;width:40px;text-align:center;flex:none}
.cnt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center}
.cnt .disc{width:280px;height:280px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:160px;font-weight:800;color:var(--brand);line-height:1;box-shadow:0 4px 16px rgba(10,14,22,.2);animation:pop .9s ease-out}
.cnt .go{height:220px;padding:0 72px;border-radius:110px;background:var(--brand);color:#fff;display:flex;align-items:center;font-size:160px;font-weight:800;line-height:1;letter-spacing:-.02em;animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.92)}25%{transform:scale(1)}}
.podium{position:absolute;bottom:0;display:flex;align-items:flex-end;gap:8px}
.pod{width:200px;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:4px;position:relative}
.pod .pn{font-size:64px;font-weight:800;color:#B9C0CB;line-height:1}
.pod .bean{position:absolute;left:50%;margin-left:-36px;width:72px;height:102px;border-radius:36px 36px 30px 30px}
.pod .bean::after{left:14px;right:14px;top:20px;height:24px;border-radius:12px}
.pod .lab{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:8px 14px;text-align:center;white-space:nowrap;box-shadow:0 1px 4px rgba(10,14,22,.18)}
</style>

<body>
<div id="mock"><div class="r" id="mscr"></div><div class="r" id="mst"></div></div>
<div id="stage"></div>
<script>
const ICON={
  back:'<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg class="svgi chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  right:'<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',

  door:'<svg viewBox="0 0 24 24" fill="none" stroke="#9AA2AF" stroke-width="1.6" stroke-linejoin="round"><path d="M5 21V4.5L15 3v18M15 5h4v16M3 21h18"/><circle cx="12" cy="12.5" r=".9" fill="#9AA2AF"/></svg>',

  folder:'<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6h7l2 2h9v11H3z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  none:'<svg viewBox="0 0 24 24" fill="none" stroke="#8C93A0" stroke-width="2.5" stroke-linecap="round"><path d="M6 18L18 6"/></svg>',
  cloud:'<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M4 19h16"/></svg>',
  ok:'<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
};
const LOGO=(c='var(--brand)',s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><rect x="9" y="3" width="22" height="34" rx="11" fill="${c}"/><rect x="13" y="10" width="14" height="8" rx="4" fill="#fff"/></svg>`;
const GEN={race:'Гонка',surv:'Выживание',pts:'Очки'};
const MAPS=[['Дверной переполох','race','Добегите до финиша'],['Молоты и качели','race','Доберитесь до финиша'],['Скользкий склон','race','Доберитесь до финиша'],['Невидимый мост','race','Найдите путь и добегите до финиша'],['Барабаны','race','Доберитесь до финиша'],['Прыг-клуб','surv','Не упадите'],['Перекати-поле','surv','Не упадите'],['Скалолазы','race','Заберитесь на вершину'],['Стенобой','surv','Не упадите'],['Хекс-а-гон','surv','Продержитесь дольше всех'],['Гора короны','race','Доберитесь до короны'],['Падающие плиты','surv','Продержитесь дольше всех'],['Портальный переполох','race','Добегите до финиша'],['Прыг-скок','race','Допрыгайте до финиша'],['Ледяные небеса','race','Доскользите до финиша'],['Звездопад','pts','Соберите больше всех звёзд'],['Хвостики','pts','Держите хвост как можно дольше']];
const P={
  me:{n:'Kauri',i:'K',c:'#D9480F'},
  ez:{n:'Ёжик',i:'Ё',c:'#2B8A3E'},
  px:{n:'pixelfox',i:'P',c:'#1971C2'},
  ma:{n:'Маринка',i:'М',c:'#C2255C'},
  de:{n:'Dendy',i:'D',c:'#6741D9'},
  lu:{n:'Lunar',i:'L',c:'#0B7285'},
  fa:{n:'Фасолька',i:'Ф',c:'#B35C00',bot:1},
  go:{n:'Горошек',i:'Г',c:'#5C940D',bot:1},
};
const av=(p,cls='')=>`<span class="av ${cls}" style="--c:${p.c}">${p.i}</span>`;
const tog=(on,attrs='')=>`<button class="tog${on?' on':''}" role="switch" aria-checked="${!!on}" data-tog ${attrs}></button>`;
const chips=(items,sel,cls='',dis=[])=>`<div class="chips ${cls}" data-single>${items.map(t=>`<button class="chip${t===sel?' sel':''}" ${dis.includes(t)?'disabled':''}>${t}</button>`).join('')}</div>`;
function sl(min,max,step,val,fmt){const p=(val-min)/(max-min)*100;return `<div class="sl"><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" style="--p:${p}%" data-fmt="${fmt}"><output>${fmtv(val,fmt)}</output></div>`}
function fmtv(v,f){v=+v;if(f==='x')return v.toFixed(2).replace('.',',');if(f==='%')return Math.round(v*100)+' %';if(f==='deg')return v+'°';return v}

/* ---------- world ---------- */
function world(kind,o={}){
  let h=`<div class="world"><div class="cloud" style="left:150px;top:96px;width:200px"></div><div class="cloud" style="left:420px;top:150px;width:120px"></div><div class="cloud" style="left:1120px;top:80px;width:260px"></div><div class="cloud" style="left:1300px;top:170px;width:110px"></div>
  <div class="hill" style="left:-200px;top:330px;width:900px;height:320px"></div><div class="hill" style="left:900px;top:350px;width:1000px;height:300px;background:#A9D6A2"></div><div class="gnd"></div>`;
  if(kind==='podium'){
    h+=`<div style="position:absolute;left:0;right:0;top:600px;bottom:0;background:#E9E3D3"></div>`;
  }else{
    h+=`<div class="course"></div><div class="edge"></div><div class="edge r"></div>
    <div class="stripe" style="clip-path:polygon(49.7% 0,50.3% 0,51.2% 100%,48.8% 100%)"></div>
    <div class="ob" style="left:760px;top:388px;width:80px;height:40px;background:#fff;box-shadow:inset 0 -6px 0 #74C0FC"></div>
    <div class="ob" style="left:640px;top:470px;width:14px;height:120px;background:#9AA5B4;border-radius:7px"></div>
    <div class="ob" style="left:600px;top:450px;width:96px;height:48px;background:#74C0FC;border-radius:14px"></div>
    <div class="ob" style="left:930px;top:520px;width:220px;height:28px;background:#fff;border-radius:14px"></div>
    <div class="ob" style="left:1010px;top:548px;width:60px;height:12px;background:#9AA5B4;border-radius:6px"></div>`;
    const beans=o.beans||[[P.ez,780,430,.55,1],[P.px,700,520,.75],[P.ma,880,560,.85],[P.de,1040,470,.65],[P.fa,560,640,1],[P.me,760,700,1.35,0,1]];
    beans.forEach(([p,x,y,s,far,me])=>{
      h+=`<div class="bean${me?' back':''}" style="--c:${p.c};left:${x}px;top:${y}px;transform:scale(${s})"></div>`;
      if(o.tags!==false&&!me) h+=`<div class="tag${far?' far':''}" style="left:${x+24}px;top:${y+68-68*s-36}px;--c:${p.c}"><i></i>${p.n}${p.badge||''}</div>`;
    });
  }
  return h+'</div>';
}

/* ---------- HUD ---------- */
const RACE=[
 [1,P.ez,'🏁1',14,'32 мс'],[2,P.me,'🏁2',12,'24 мс',1],[3,P.px,'',9,'41 мс'],[4,P.de,'',7,'77 мс'],[5,P.fa,'',6,'бот'],[6,P.ma,'✖',5,'58 мс',0,1],[7,P.go,'👁️',2,'бот'],[8,P.lu,'',0,'—',0,1]];
function standings(mode,o={}){
  let hd,rows;
  if(mode==='lobby'){
    hd=`<div class="l1"><span class="gt g-none">Лобби</span></div><div class="l2">Комната Kauri</div>`;
    const L=[[P.me,'⭐',3,1,'24 мс',1],[P.ez,'',2,0,'32 мс'],[P.px,'',1,2,'41 мс'],[P.ma,'',1,0,'58 мс'],[P.de,'',0,1,'77 мс'],[P.fa,'',0,0,'бот'],[P.go,'',0,0,'бот'],[P.lu,'',0,0,'—',0,1]];
    rows=L.map(([p,h,c,b,pg,me,dm])=>`<div class="sr${me?' me':''}${dm?' dim2':''}"><span class="nm">${p.n}${h?' '+h:''}</span><span class="st">${c?'👑'+c:''}</span><span class="st">${b?'🔔'+b:''}</span><span class="pg">${pg}</span></div>`).join('');
  }else if(mode==='podium'){
    hd=`<div class="l2">Итоги игры</div>`;
    rows=[[1,o.win?P.me:P.ez,41],[2,o.win?P.ez:P.me,38],[3,P.px,29],[4,P.de,24],[5,P.ma,22],[6,P.fa,19],[7,P.go,11],[8,P.lu,4]].map(([n,p,s])=>`<div class="sr${p===P.me?' me':''}${p===P.lu?' dim2':''}"><span class="pl ${n<4?'p'+n:''}">${n}</span><span class="nm">${p.n}${p===P.me?' ⭐':''}</span><span class="sc">${s}</span><span class="pg">${p.bot?'бот':p===P.lu?'—':'30 мс'}</span></div>`).join('');
  }else{
    const pts=mode==='points',pr=mode==='practice';
    hd=pr?`<div class="l1"><span class="gt g-race">Тренировка</span>Гонка</div><div class="l2">Скалолазы</div>`
      :pts?`<div class="l1"><span class="gt g-pts">4/5</span>Очки</div><div class="l2">Звездопад</div>`
      :`<div class="l1"><span class="gt g-race">2/5</span>Гонка</div><div class="l2">Молоты и качели</div>`;
    let data=RACE;
    if(pts) data=[[1,P.px,'',22,'41 мс',0,0,9],[2,P.me,'',19,'86 мс',1,0,7],[3,P.ez,'',18,'32 мс',0,0,6],[4,P.ma,'',15,'58 мс',0,0,4],[5,P.de,'',13,'77 мс',0,0,3],[6,P.fa,'',11,'бот',0,0,2],[7,P.go,'',6,'бот',0,0,1],[8,P.lu,'',0,'—',0,1,0]];
    if(pr) data=[[1,P.me,'',0,'24 мс',1],[2,P.fa,'',0,'бот'],[3,P.go,'',0,'бот'],[4,{n:'Бобик',i:'Б',c:'#495057',bot:1},'',0,'бот']];
    if(o.data) data=o.data;
    rows=data.map(([n,p,st,sc,pg,me,dm,bells])=>`<div class="sr${me?' me':''}${dm?' dim2':''}"><span class="pl ${n<4&&!pr?'p'+n:''}">${n}</span><span class="nm">${p.n}${me&&!pr?' ⭐':''}</span><span class="st">${st}</span>${pts?`<span class="sc grn">${bells}</span>`:''}${pr?'':`<span class="sc">${sc}</span>`}<span class="pg">${pg}</span></div>`).join('');
  }
  return `<div class="stand hp"><div class="hd">${hd}</div>${rows}</div>`;
}
function netline(top,ws,extra){
  return `<div class="net hp" style="top:${top}px">${ws?'WebSocket':'UDP'} <span class="mut">·</span> ${ws?'86':'24'} мс <span class="mut">·</span> 144 к/с</div>${extra||''}`;
}
function timer(t,frac,low,map,bonus){
  return `<div class="timer"><div class="tbox hp${low?' low':''}"><span class="tv">${t}</span><span class="tb"><i style="width:${frac}%"></i></span></div>
  <div class="row g8">${map?`<div class="pill hp">${map}</div>`:''}${bonus?`<div class="pill hp">${bonus}</div>`:''}</div></div>`;
}
const fl=(h,cls='')=>`<div class="fl ${cls}">${h}</div>`;
const nm=(p)=>`<span class="cd" style="--c:${p.c}"></span><b>${p.n}</b>`;
function chat(open,lines){
  const L=lines.map(([p,t])=>p?`<div class="cl"><span class="cd" style="--c:${p.c}"></span><b>${p.n}</b>: ${t}</div>`:`<div class="cl sys"><b>Сервер</b>: ${t}</div>`).join('');
  return `<div class="chat${open?' open':''}">${L}${open?'<input class="in" maxlength="160" placeholder="Сообщение: Enter — отправить, Esc — закрыть" data-chat autofocus>':''}</div>`;
}
const CHAT=[[P.ez,'кто опять толкнул меня с качелей?'],[P.px,'не я'],[null,'Lunar потерял связь'],[P.ma,'давайте потом Хекс-а-гон'],[P.de,'+'],[P.me,'иду на рекорд'],[P.ez,'ну-ну']];

function hud(st){
  const race=st!=='points'&&st!=='lobby';
  let h=world('course');
  if(st==='lobby'){
    h+=standings('lobby')+netline(418)+chat(false,CHAT.slice(-3));
    return h;
  }
  if(st==='points'){
    h+=standings('points')+netline(418,1,`<div class="hp" style="position:absolute;left:24px;top:460px;width:372px;padding:14px 16px;font-size:16px;line-height:1.4"><b>Игра идёт через WebSocket: UDP до сервера не доходит</b><div class="mut t14" style="margin-top:6px">Если включён VPN, пустите адрес сервера мимо него или выберите в VPN протокол Hysteria2 или TUIC — они пропускают UDP.</div></div>`);
    h+=timer('1:42',68,0,'Звёзд на поле: 9','⚡ Ускорение · 4 с');
    h+=`<div class="feed">${fl('🔔 Ёжик звонит в колокол на башне (в 2-й раз)')}${fl(`${nm(P.de)} ✊ ${nm(P.px)} — захват`)}${fl('⚡ <b>Вы</b>: Ускорение!')}${fl('🔔 Вы звоните в колокол на башне')}</div>`;
    h+=chat(false,CHAT.slice(-2));
    return h;
  }
  const low=st==='last10';
  h+=standings('race')+netline(418);
  h+=timer(low?'0:07':'1:24',low?6:58,low,'Контрольная точка 2 из 3',low?'':'🦘 Мега-прыжок · 6 с');
  const f=low?[fl(`🏁 ${nm(P.px)}: финиш, 3 место (1:12,4)`),fl(`${nm(P.de)} 🤸 ${nm(P.go)} — сбит нырком`),fl(`${nm(P.ma)} выбывает (🕳 падение)`,'out'),fl(`🚫 ${nm(P.me)} — срезка пути: −2`)]
    :[fl(`${nm(P.ez)} 🥊 ${nm(P.px)} — перчатка`),fl(`🔨 ${nm(P.ma)} — молот`),fl(`🏁 ${nm(P.ez)}: финиш, 1 место (0:48,2)`),fl('🦘 <b>Вы</b>: Мега-прыжок!'),fl(`${nm(P.lu)} выбывает (🕳 падение)`,'out')];
  h+=`<div class="feed">${f.join('')}</div>`;
  if(st==='race') h+=chat(true,CHAT);
  else h+=chat(false,CHAT.slice(-2));
  if(st==='mouse') h+=`<div class="center" style="top:520px;background:var(--ink);color:#fff;border-radius:20px;padding:20px 32px;text-align:center"><div class="t24 b">🖱 Щёлкните по полю, чтобы вернуть управление</div><div class="t16" style="color:#C3C8D1;margin-top:6px">или нажмите Esc для меню</div></div>`;
  return h;
}

/* ---------- intro / countdown ---------- */
function intro(st){
  let h=world('course',{tags:false})+standings('race',{data:RACE.map(r=>[r[0],r[1],'',r[3],r[4],r[5],r[6]])});
  if(st==='intro'){
    h+=`<div class="center hp" style="bottom:64px;width:880px;padding:32px 40px;border-radius:24px">
      <div class="row sp"><div class="row g12"><span class="gt g-race">Гонка</span><span class="t20 b">Раунд 2 из 5</span></div><span class="t20 b mut num">Старт через 6 с</span></div>
      <div class="t64 xb" style="margin:12px 0 8px;letter-spacing:-.02em">Молоты и качели</div>
      <div class="t24 b">🎯 Доберитесь до финиша.</div>
      <div class="t20 mut" style="margin-top:8px;line-height:1.4">Качели наклоняются под весом бобов, а молоты сметают с дорожки. Держитесь середины и прыгайте, когда молот уходит вверх.</div></div>`;
  }else if(st==='go') h+=`<div class="cnt"><div class="go">ВПЕРЁД!</div></div>`;
  else h+=`<div class="cnt"><div class="disc">${st}</div></div>`;
  return h;
}

/* ---------- results ---------- */
function results(st){
  const pr=st==='practice',fin=st==='final',pts=st==='points';
  const cap=pr?'тренировка':`итоги раунда ${fin?'5':pts?'4':'2'} из 5`;
  const map=pr?'Скалолазы':pts?'Звездопад':fin?'Хекс-а-гон':'Молоты и качели';
  const next=pr?'Заново через 5 с':fin?'Итоги игры через 8 с':'Следующий раунд через 8 с';
  let R;
  if(pr) R=[[1,P.me,'финиш за 1:04,8',10,0,0,10],[2,P.fa,'финиш за 1:19,0',8,0,0,8],[3,P.go,'без финиша',0,0,0,0],[4,{n:'Бобик',i:'Б',c:'#495057'},'без финиша',0,0,0,0]];
  else if(pts) R=[[1,P.px,'очки: 9',10,0,1,32],[2,P.me,'очки: 7',8,0,0,30],[3,P.ez,'очки: 6',6,0,-2,28],[4,P.ma,'очки: 4',5,0,0,21],[5,P.de,'очки: 3',4,0,1,17],[6,P.fa,'очки: 2',3,0,-1,15],[7,P.go,'очки: 1',2,0,0,8],[8,P.lu,'очки: 0',0,0,0,0]];
  else if(fin) R=[[1,P.ma,'до конца раунда',10,0,2,22],[2,P.me,'до конца раунда',8,0,0,38],[3,P.ez,'в игре 74 с',6,0,0,41],[4,P.px,'в игре 61 с',5,0,0,29],[5,P.de,'в игре 40 с',4,0,0,24],[6,P.fa,'в игре 33 с',3,0,-1,19],[7,P.go,'в игре 12 с',2,0,-1,11],[8,P.lu,'в игре 0 с',0,0,0,4]];
  else R=[[1,P.ez,'финиш за 0:48,2',10,0,1,24],[2,P.me,'финиш за 0:51,7',8,2,-1,22],[3,P.px,'финиш за 1:12,4',6,0,0,15],[4,P.de,'финиш за 1:20,0',5,0,2,12],[5,P.fa,'финиш за 1:31,5',4,0,0,10],[6,P.ma,'без финиша',0,0,-2,9],[7,P.go,'без финиша',0,0,0,5],[8,P.lu,'без финиша',0,0,0,2]];
  const rows=R.map(([n,p,note,plus,minus,d,tot])=>`<tr class="${p===P.me?'me':''}"><td style="width:48px"><span class="pl ${n<4?'p'+n:''}" style="width:32px;height:32px;font-size:16px">${n}</span></td>
    <td><div class="row g12">${av(p,'xs')}<span class="b">${p.n}</span><span class="t16 mut">${note}</span></div></td>
    <td class="b grn num" style="width:64px;text-align:right">+${plus}</td>
    <td class="b red num" style="width:64px;text-align:right">${minus?'−'+minus:''}</td>
    <td style="width:72px;text-align:center">${d?`<span class="dlt ${d>0?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d)}</span>`:'<span class="dlt">—</span>'}</td>
    <td class="xb num t24" style="width:64px;text-align:right">${tot}</td></tr>`).join('');
  return world('course',{tags:false})+`<div class="dim" style="background:rgba(14,18,26,.25)"></div>
  <div class="center hp" style="top:${pr?200:80}px;width:920px;padding:32px 40px 24px;border-radius:24px">

/* ---------- spectate ---------- */
function spectate(st){
  const d=RACE.map(r=>r.slice());
  if(st==='out'){d[1][2]='✖';d[1][5]=1;d[1][6]=1;}
  if(st==='spectator'){d[1][2]='👁️';}
  let h=world('course',{beans:[[P.ez,780,430,.55,1],[P.px,700,520,.85],[P.ma,880,540,.9],[P.de,1000,620,1.2]]})+standings('race',{data:d})+netline(418)+timer('0:52',36,0,'Контрольная точка 3 из 3','');
  h+=`<div class="feed">${fl(st==='out'?`${nm(P.me)} выбывает (🔨 молот)`:st==='finish'?`🏁 ${nm(P.me)}: финиш, 2 место (0:51,7)`:`🏁 ${nm(P.ez)}: финиш, 1 место (0:48,2)`,st==='out'?'out':'')}</div>`;
  const top=st==='finish'?'🏁 Финиш: 2-е место!':st==='out'?'<span class="red">Вы выбыли</span>':'👁️ Вы зритель';
  const cam=st==='spectator'?'Камера: обзор арены':'Камера: Dendy';
  h+=`<div class="center hp" style="bottom:32px;padding:20px 24px;border-radius:20px;text-align:center;min-width:560px">
    <div class="t32 xb">${top}</div>
    <div class="row g16" style="justify-content:center;margin-top:12px"><button class="btn sm ic" aria-label="Предыдущий">${ICON.back}</button><span class="t20 b">${cam}</span><button class="btn sm ic" aria-label="Следующий">${ICON.right}</button></div>
    <div class="t16 mut" style="margin-top:8px">ЛКМ/ПКМ или A/D — сменить игрока</div></div>`;
  return h;
}

/* ---------- summary ---------- */
function summary(st){
  const win=st==='win';
  const first=win?P.me:P.ez, second=win?P.ez:P.me;
  const pod=(p,n,hgt,score)=>`<div class="pod" style="height:${hgt}px"><span class="pn">${n}</span><div class="bean" style="--c:${p.c};top:-110px"></div><div class="lab" style="top:-176px"><div class="t20 b">${p.n}</div><div class="t16 mut num">${score} очков · ${n} место</div></div></div>`;
  let h=world('podium')+standings('podium',{win})+`<div class="podium" style="left:340px">${pod(second,2,170,38)}${pod(first,1,250,41)}${pod(P.px,3,110,29)}</div>`;
  const T=(win?[[1,P.me,3,41],[2,P.ez,1,38]]:[[1,P.ez,2,41],[2,P.me,1,38]]).concat([[3,P.px,1,29],[4,P.de,0,24],[5,P.ma,1,22],[6,P.fa,0,19],[7,P.go,0,11],[8,P.lu,0,4]]);
  const A=[['⚡','Молния',P.ez,'лучшие места в гонках'],['🛡️','Несокрушимость',P.ma,'214 с в игре'],['💥','Задира',P.de,'17 сбитых соперников'],['🤲','Цепкие руки',P.px,'9 захватов'],['🍌','Неваляшка',P.go,'23 падений'],['🦊','Хитрая лиса',P.me,'3 срезок пути (и штрафы за них)']];
  h+=`<div class="hp" style="position:absolute;right:24px;top:24px;bottom:24px;width:600px;padding:28px 32px;border-radius:24px;display:flex;flex-direction:column;gap:16px">
    <div><div class="t16 b mut">Итоги игры</div><div class="t48 xb" style="letter-spacing:-.02em;white-space:nowrap">${win?'👑 Вы победили!':'👑 Ёжик побеждает!'}</div><div class="row g8 t16 mut" style="margin-top:4px"><span class="spin sm"></span>Возврат в лобби через 14 с</div></div>
    <div><div class="t20 b" style="margin-bottom:6px">Итоговая таблица</div>${T.map(([n,p,w,t])=>`<div class="sr${p===P.me?' me':''}" style="height:32px"><span class="pl ${n<4?'p'+n:''}">${n}</span><span class="nm">${p.n}</span><span class="t14 b" style="width:48px">${w?'🏆'+w:''}</span><span class="sc">${t}</span></div>`).join('')}</div>
    <div><div class="t20 b" style="margin-bottom:8px">Награды</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${A.map(([e,t,p,v])=>`<div class="award"><span class="em">${e}</span><div style="min-width:0"><div class="t16 b">${t}</div><div class="t14"><b>${p.n}</b> <span class="mut">· ${v}</span></div></div></div>`).join('')}</div></div></div>`;
  return h;
}

function settings(st){
  const rb=st==='rebind'; const cat=rb?'keys':st;
  return `<div class="layer home">${hbar('settings')}<div class="hmain" style="grid-template-columns:1fr">${settingsUI(cat,rb)}</div></div>`;
}

/* ---------- lobby / esc menu ---------- */
const SUITS=['#D9480F','#2B8A3E','#1971C2','#C2255C','#6741D9','#0B7285','#B35C00','#5C940D'];
function lobby(st){
  const host=st!=='guest', practice=st==='practice', running=st==='running';
  let h=world('course',{tags:true})+(practice?standings('practice'):'')+'<div class="dim"></div>';
  const tab=st==='settings'?'settings':st==='dev'?'dev':'game';
  const tabs=[['game','Игра'],['settings','Настройки']]; if(!practice&&st!=='guest') tabs.push(['dev','Dev']);
  const tabbar=`<div class="mtabs"><div class="seg" style="background:var(--s2)">${tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-mtab="${k}">${l}</button>`).join('')}</div><div class="row g8 t16 mut"><span class="kc">Esc</span>закрыть меню</div></div>`;
  if(practice){
    return h+`<div class="menu narrow">${tabbar}<div class="mbody"><div class="mpane on" data-mp="game"><div class="col g24" style="padding:8px 0 8px">
      <div class="row g12"><span class="gt g-race">Тренировка</span><span class="t16 mut">Гонка · 3 бота</span></div>
      <div class="t24 b" style="line-height:1.4">Тренировка: «Скалолазы». Раунд повторяется с ботами, пока вы не вернётесь.</div>
      <button class="btn lg f" style="align-self:flex-start" data-go="rooms/list">${ICON.back}К списку комнат</button></div></div>
      <div class="mpane" data-mp="settings" style="height:620px">${settingsUI('controls')}</div></div></div>`;
  }
  const priv=st!=='host'&&st!=='min';
  const roomSec=`<div class="sec col g16"><div class="t16 b mut">Комната</div><div class="t24 xb">${priv?'🔒 ':''}${host?'Комната Kauri':'Вечерние забеги'}</div>
    ${host?`<div class="srow tg" style="min-height:0;border:0;padding:0" data-rowtog data-pin><span class="t16 b grow">Приватная комната (вход по PIN-коду)</span>${tog(priv)}</div>
    <div class="t16 pinline" style="${priv?'':'display:none'}">Приватная комната — PIN-код для входа: <b class="t24 num" style="letter-spacing:.08em">4821</b></div>`
    :`<div class="t16 mut" style="line-height:1.4">Приватная комната: PIN-код для друзей знает хост ⭐</div>`}
    <div data-confirm-wrap><button class="btn d sm" data-confirm="Выйти из комнаты?" data-yes="Выйти" data-go-yes="rooms/list">Выйти из комнаты</button></div></div>`;
  const taken=[1,2,3,4];
  const beanSec=`<div class="sec col g16"><div class="t16 b mut">Ваш боб</div>
    <div class="row g12"><input class="in grow" maxlength="16" value="Kauri" style="height:48px;font-size:20px"><button class="btn sm" style="height:48px">Сохранить</button></div>
    ${running?'':`<div class="row g8" data-swg>${SUITS.map((c,i)=>`<button class="sw${i===0?' sel':''}" style="--c:${c};width:36px;height:36px" ${taken.includes(i)?'disabled title="занят"':''} aria-label="Цвет">${i===0?ICON.check:''}</button>`).join('')}</div>`}
    <button class="fold-h${st==='outfit'?' f':''}" style="height:56px;background:#fff;border-radius:14px;font-size:20px" data-go="${st==='outfit'?'lobby/host':'lobby/outfit'}"><span>Шапка, очки и цвета</span>${st==='outfit'?ICON.back:ICON.right}</button></div>`;
  let people;
  if(st==='min') people=[[P.me,'24 мс',1]];
  else if(st==='guest') people=[[P.ez,'32 мс',0,1],[P.me,'24 мс',1],[P.px,'41 мс'],[P.ma,'58 мс'],[P.de,'77 мс'],[P.lu,'нет связи'],[P.fa,'бот'],[P.go,'бот']];
  else people=[[P.me,'24 мс',1,1],[P.ez,'32 мс'],[P.px,'41 мс'],[P.lu,'нет связи'],[P.fa,'бот'],[P.go,'бот']];
  const crowns={Kauri:3,'Ёжик':2,pixelfox:1};
  const fillOn=st==='custom';
  const plSec=`<div class="sec col g12${host?' host':''}" style="height:100%"><div class="row sp"><span class="t20 b">Игроки: ${people.length} из 8</span></div><div class="meter" style="margin-bottom:4px"><i style="width:${people.length/8*100}%"></i></div>
    ${people.map(([p,sub,me,ho],i)=>`<div class="prow${host&&i===1&&st==='host'?' f':''}">${av(p,'s')}<div class="grow"><div class="t20 b ell">${p.n}${me?' (вы)':''}</div><div class="t14 ${sub==='нет связи'?'red b':'mut'}">${sub}</div></div>
      <span class="bdg row g8 t16 b">${ho||(host&&me)?'<span>⭐</span>':''}${crowns[p.n]?`<span>👑 ${crowns[p.n]}</span>`:''}</span>
      ${host&&!me?`<span class="act">${p.bot?(fillOn?'':`<button class="btn sm ic" aria-label="Убрать бота" data-rmrow="Бот ${p.n} убран">×</button>`):'<button class="btn sm">Сделать хостом</button>'}</span>`:''}</div>`).join('')}</div>`;
  let gameSec;
  if(!host) gameSec=`<div class="sec col g16" style="height:100%;align-items:center;justify-content:center;text-align:center"><span class="spin lg"></span><div class="t24 b">Игру запускает хост ⭐</div><div class="t16 mut">Микс · Раундов: 5</div></div>`;
  else{
    const custom=st==='custom';
    const order=['Молоты и качели','Хекс-а-гон','Звездопад','Скалолазы','Падающие плиты'];
    const mapChips=custom?`<div class="col g8"><div class="row sp"><span class="t16 b">Карты по порядку</span><span class="t14 mut num" data-cnt>${order.length} из 12</span></div><div class="chips sm" data-order>${MAPS.map(([t,g])=>{const o=order.indexOf(t);return `<button class="chip${o>=0?' sel':''}" data-map="${t}">${o>=0?`<span class="ord">${o+1}.</span>`:`<i class="gdot" style="background:var(--${g})"></i>`}${t}</button>`}).join('')}</div></div>`
      :`<div class="row g16"><span class="t20 b">Раундов:</span>${chips(['3','5','7'],'5')}</div>`;
    const canStart=st!=='min';
    gameSec=`<div class="sec col g16" style="height:100%"><h2>Игра</h2>${chips(['Микс','Гонки','Выживание','Свой список'],custom?'Свой список':'Микс')}${mapChips}
      <div class="srow tg" style="min-height:0;border:0;padding:4px 0" data-rowtog><span class="t20 grow">Заполнять свободные места ботами</span>${tog(fillOn)}</div>
      ${fillOn||people.length>=8?'':'<button class="btn sm" style="align-self:flex-start">+ Добавить бота</button>'}
      <div style="margin-top:auto">${canStart?'<button class="btn p lg w">Начать игру</button>':'<button class="btn lg w" disabled>Нужно хотя бы 2 игроков</button>'}</div></div>`;
  }
  let game;
  if(running){
    game=`<div style="display:grid;grid-template-columns:392px 1fr;gap:24px;height:100%"><div class="col g24">${roomSec}${beanSec}</div>
      <div class="sec col g24" style="align-self:start"><div class="row g12"><span class="badge bd-live">идёт игра</span><span class="gt g-race">2/5</span></div>
      <div class="t32 xb" style="line-height:1.25">Идёт раунд 2 из 5: «Молоты и качели»</div>
      <div class="t16 mut">Меню не ставит игру на паузу — ваш боб стоит на месте, пока меню открыто.</div>
      <div data-confirm-wrap><button class="btn d" data-confirm="Прервать игру для всех?" data-yes="Прервать" data-go-yes="lobby/host">Прервать игру</button></div></div></div>`;
  }else if(st==='outfit'){
    const hats=['Без шапки','🧢 Кепка','🧶 Шапка','🥳 Колпак','🎩 Цилиндр','🤠 Ковбойская шляпа','⚔ Викинг','🚁 Пропеллер','🐰 Ушки зайки','🐱 Ушки кошки','😈 Рожки','😇 Нимб','🌸 Цветок','👽 Антенны'];
    const gl=['Без очков','👓 Круглые','🕶 Тёмные','💕 Сердечки','🧐 Монокль','🥽 Визор'];
    const pal=['#F8F9FA','#212529','#E03131','#F59F00','#2F9E44','#1C7ED6','#7048E8','#E64980','#8D6E63'];
    const sws=(sel,def)=>`<div class="row g12" data-swg>${def?`<button class="sw${sel===-1?' sel':''}" style="--c:#fff" aria-label="Как задумано">${ICON.none}</button>`:''}${pal.map((c,i)=>`<button class="sw${i===sel?' sel':''}" style="--c:${c}" aria-label="Цвет">${i===sel?ICON.check.replace('#fff',i===0?'#161A21':'#fff'):''}</button>`).join('')}</div>`;
    const lab=t=>`<div class="t16 b" style="margin-bottom:8px">${t}</div>`;
    game=`<div class="lob" style="grid-template-columns:392px 1fr"><div class="col g24">${roomSec}${beanSec}</div>
      <div class="sec" style="display:grid;grid-template-columns:220px 1fr;gap:32px;height:100%">
        <div class="col" style="align-items:center;justify-content:center;background:#fff;border-radius:16px;position:relative"><div class="bean" style="position:relative;--c:#D9480F;width:110px;height:156px;border-radius:55px 55px 46px 46px"></div><div style="position:absolute;top:calc(50% - 98px);width:76px;height:26px;border-radius:13px 13px 4px 4px;background:#1C7ED6"></div></div>
        <div class="col g16">
          <div>${lab('Шапка')}${chips(hats,'🧢 Кепка','sm')}</div>
          <div>${lab('Цвет шапки')}${sws(5,1)}</div>
          <div>${lab('Очки')}${chips(gl,'Без очков','sm')}</div>
          <div class="row g32"><div>${lab('Цвет живота')}${sws(0)}</div></div>
          <div>${lab('Цвет ботинок')}${sws(1)}</div>
          <div class="row g12" style="margin-top:auto"><button class="btn sm">🎲 Случайно</button><button class="btn sm" data-reset2>Сбросить</button></div>
        </div></div></div>`;
  }else{
    game=`<div class="lob"><div class="col g24">${roomSec}${beanSec}</div>${plSec}${gameSec}</div>`;
  }
  const dev=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div class="sec col g16"><div class="t16 b mut">Время:</div><div class="chips" data-single>${['⏸','×0.1','×0.25','×0.5','×1','×2','×4'].map(t=>`<button class="chip${t==='×1'?' sel':''}">${t}</button>`).join('')}</div><div class="row g8"><button class="btn sm">+1 тик</button><button class="btn sm">+0,5 с</button></div>
      <div class="row g8" style="flex-wrap:wrap"><button class="btn sm">Пропустить заставку</button><button class="btn sm">+10 с</button><button class="btn sm">Завершить раунд</button><button class="btn sm">В лобби</button></div></div>
    <div class="sec col g16"><div class="t16 b mut">Телепорт:</div><div class="row g8" style="flex-wrap:wrap">${['старт','КТ 1','КТ 2','КТ 3','финиш'].map(t=>`<button class="btn sm">${t}</button>`).join('')}</div>
      <div class="t16 b mut">Боты и боб</div><div class="row g8" style="flex-wrap:wrap"><button class="btn sm">+ бот рядом</button><button class="btn sm">Заморозить ботов</button><button class="btn sm">Разморозить ботов</button><button class="btn sm">Сбить меня</button><button class="btn sm">Выбыть</button></div></div>
    <div class="fold open" style="grid-column:1/3"><button class="fold-h" style="background:var(--s2)"><span>Запустить карту</span>${ICON.chev}</button><div class="fold-b" style="background:var(--s2);border-radius:0 0 18px 18px;padding:0 24px 24px"><div class="chips sm">${MAPS.map(([t,g])=>`<button class="chip"><i class="gdot" style="background:var(--${g})"></i>${t}</button>`).join('')}</div></div></div></div>`;
  return h+`<div class="menu">${tabbar}<div class="mbody">
    <div class="mpane${tab==='game'?' on':''}" data-mp="game">${game}</div>
    <div class="mpane${tab==='settings'?' on':''}" data-mp="settings">${settingsUI('controls')}</div>
    <div class="mpane${tab==='dev'?' on':''}" data-mp="dev">${dev}</div></div></div>`;
}

/* ---------- routing ---------- */
const SCREENS=[
 ['loading','Загрузка',loading,[['models','модели'],['maps','карты'],['shaders','шейдеры'],['regfx','новая графика']]],
 ['servers','Серверы',servers,[['list','список'],['empty','пусто'],['crash','упала'],['gpu','сброс GPU'],['adderr','ошибка адреса'],['upd','есть обновление'],['dl','скачивание'],['updfail','сбой обновления'],['restart','перезапуск']]],
 ['rooms','Комнаты',rooms,[['list','список'],['loading','загрузка'],['empty','пусто'],['pin','PIN'],['pinerr','PIN ошибка'],['own','своя есть'],['refused','отказ сервера'],['practice','тренировка']]],
 ['settings','Настройки',settings,[['controls','управление'],['screen','экран и звук'],['graphics','графика'],['keys','клавиши'],['rebind','переназначение'],['help','если сломалось']]],
 ['lobby','Лобби',lobby,[['host','хост'],['guest','не хост'],['custom','свой список'],['min','мало игроков'],['outfit','наряд'],['running','идёт игра'],['practice','тренировка'],['settings','вкладка Настройки'],['dev','вкладка Dev']]],
 ['hud','Раунд HUD',hud,[['race','гонка + чат'],['last10','последние 10 с'],['mouse','мышь свободна'],['points','очки + WebSocket'],['lobby','лобби']]],
 ['intro','Интро+отсчёт',intro,[['intro','интро'],['3','3'],['2','2'],['1','1'],['go','ВПЕРЁД!']]],
 ['results','Итоги раунда',results,[['race','гонка'],['points','очки'],['final','последний'],['practice','тренировка']]],
 ['spectate','Зритель/выбыл/финиш',spectate,[['finish','финиш'],['out','выбыл'],['spectator','зритель']]],
 ['summary','Итоги игры',summary,[['win','вы победили'],['other','победил другой']]],
 ['banner','Подключение',banner,[['connecting','подключение'],['reconnecting','переподключение'],['refused','отказ'],['outdated','устарело'],['outdated-dl','устарело: скачивание'],['outdated-fail','устарело: сбой']]],
];
const stage=document.getElementById('stage');
let cur={s:'servers',st:'list',from:'servers'};
function route(){
  let [s,st]=(location.hash.slice(1)||'servers/list').split('/');
  let S=SCREENS.find(x=>x[0]===s)||SCREENS[1];
  let states=S[3];
  if(st!==undefined&&/^\d+$/.test(st)) st=(states[+st]||states[0])[0];
  if(!states.find(x=>x[0]===st)) st=states[0][0];
  if(S[0]==='servers'||S[0]==='rooms') cur.from=S[0];
  cur.s=S[0];cur.st=st;
  stage.innerHTML=S[2](st);
  document.getElementById('mscr').innerHTML='<span class="lbl">screen</span>'+SCREENS.map(x=>`<button class="${x[0]===S[0]?'on':''}" data-h="${x[0]}/${x[3][0][0]}">${x[1]}</button>`).join('');
  document.getElementById('mst').innerHTML='<span class="lbl">state</span>'+states.map(x=>`<button class="${x[0]===st?'on':''}" data-h="${S[0]}/${x[0]}">${x[1]}</button>`).join('');
  const af=stage.querySelector('[autofocus]'); if(af) af.focus({preventScroll:true});
}
function fit(){
  const bar=document.getElementById('mock').offsetHeight, vw=innerWidth, vh=innerHeight-bar;
  const s=Math.min(vw/1600,vh/900);
  stage.style.transform=`translate(${(vw-1600*s)/2}px,${bar+(vh-900*s)/2}px) scale(${s})`;
}
addEventListener('hashchange',route);addEventListener('resize',fit);
document.getElementById('mock').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b)location.hash=b.dataset.h});

function toast(msg,undo){
  stage.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span>${msg}</span>${undo?'<button class="btn sm">Вернуть</button>':''}`;
  stage.appendChild(t);
  if(undo) t.querySelector('button').onclick=()=>{undo();t.remove()};
  setTimeout(()=>t.remove(),6000);
}
stage.addEventListener('click',e=>{
  const t=e.target;
  let el;
  if((el=t.closest('[data-go]'))&&!el.disabled){location.hash=el.dataset.go;return}
  if(el=t.closest('[data-rm]')){const card=el.closest('.item');const ph=document.createComment('');card.replaceWith(ph);toast(el.dataset.rm,()=>ph.replaceWith(card));return}
  if(el=t.closest('[data-rmrow]')){const r=el.closest('.prow');const ph=document.createComment('');r.replaceWith(ph);toast(el.dataset.rmrow,()=>ph.replaceWith(r));return}
  if(el=t.closest('[data-confirm]')){const w=el.closest('[data-confirm-wrap]');const orig=w.innerHTML;
    w.innerHTML=`<div class="confirm"><span>${el.dataset.confirm}</span><button class="btn dd sm" data-go="${el.dataset.goYes}">${el.dataset.yes}</button><button class="btn sm" data-cancel>Отмена</button></div>`;
    w.querySelector('[data-cancel]').onclick=ev=>{ev.stopPropagation();w.innerHTML=orig};w.querySelector('[data-cancel]').focus();return}
  if(el=t.closest('[data-rowtog]')){const tg=el.querySelector('.tog');tg.classList.toggle('on');tg.setAttribute('aria-checked',tg.classList.contains('on'));
    if(el.hasAttribute('data-pin')){const pl=el.parentElement.querySelector('.pinline');if(pl)pl.style.display=tg.classList.contains('on')?'':'none'}return}
  if(el=t.closest('[data-tog]')){el.classList.toggle('on');return}
  if(el=t.closest('[data-map]')){const box=el.parentElement;let sel=[...box.querySelectorAll('.chip.sel')].sort((a,b)=>a.querySelector('.ord').textContent.localeCompare(b.querySelector('.ord').textContent,undefined,{numeric:true}));
    if(el.classList.contains('sel')){sel=sel.filter(x=>x!==el);el.classList.remove('sel');el.querySelector('.ord').outerHTML='<i class="gdot" style="background:var(--'+MAPS.find(m=>m[0]===el.dataset.map)[1]+')"></i>'}
    else if(sel.length<12){sel.push(el);el.classList.add('sel');el.querySelector('.gdot').outerHTML='<span class="ord"></span>'}
    sel.forEach((c,i)=>c.querySelector('.ord').textContent=(i+1)+'.');box.parentElement.querySelector('[data-cnt]').textContent=sel.length+' из 12';return}
  if((el=t.closest('.chips[data-single] .chip'))&&!el.disabled){el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');return}
  if((el=t.closest('[data-swg] .sw'))&&!el.disabled){el.parentElement.querySelectorAll('.sw').forEach(c=>{c.classList.remove('sel');if(!c.querySelector('svg path[d^="M6 18"]'))c.innerHTML=''});el.classList.add('sel');if(!el.innerHTML)el.innerHTML=ICON.check;return}
  if(el=t.closest('.fold-h')){el.parentElement.classList.toggle('open');return}
  if(el=t.closest('[data-cat]')){const set=el.closest('.set');set.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('on',b===el));set.querySelectorAll('.spane').forEach(p=>p.classList.toggle('on',p.dataset.pane===el.dataset.cat));return}
  if(el=t.closest('[data-mtab]')){const m=el.closest('.menu');m.querySelectorAll('[data-mtab]').forEach(b=>b.classList.toggle('on',b===el));m.querySelectorAll('.mpane').forEach(p=>p.classList.toggle('on',p.dataset.mp===el.dataset.mtab));return}
  if(el=t.closest('[data-rebind]')){startRebind(el.closest('.srow'));return}
  if(el=t.closest('[data-reset]')){toast('Клавиши возвращены как были',()=>{});return}
  if(el=t.closest('[data-reset2]')){toast('Наряд сброшен',()=>{});return}
});
function startRebind(row){
  const ctl=row.querySelector('.ctl'),orig=ctl.innerHTML;
  stage.querySelectorAll('.srow.rebind').forEach(r=>r.classList.remove('rebind'));
  row.classList.add('rebind');row.style.padding='8px 32px';
  ctl.innerHTML='<span class="t20 b" style="color:var(--brand)">Нажмите клавишу… (Esc — отмена)</span><button class="btn sm f" style="width:120px">Изменить</button>';
  const h=e=>{e.preventDefault();removeEventListener('keydown',h,true);row.classList.remove('rebind');row.style.padding='8px 0';
    if(e.key==='Escape'){ctl.innerHTML=orig;return}
    const k=e.code.replace(/^Key|^Digit/,'');ctl.innerHTML=`<span class="kc">${k}</span><button class="btn sm" data-rebind style="width:120px">Изменить</button>`};
  addEventListener('keydown',h,true);
}
stage.addEventListener('input',e=>{const r=e.target;if(r.type==='range'){r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%');r.nextElementSibling.textContent=fmtv(r.value,r.dataset.fmt)}
  if(r.closest('.pin')&&r.value&&r.nextElementSibling)r.nextElementSibling.focus()});
stage.addEventListener('keydown',e=>{const t=e.target;
  if(t.matches('[data-chat]')&&e.key==='Enter'&&t.value.trim()){const d=document.createElement('div');d.className='cl';d.innerHTML=`<span class="cd" style="--c:${P.me.c}"></span><b>Kauri</b>: `;d.append(t.value);t.before(d);t.value=''}
  if(t.matches('[data-chat]')&&e.key==='Escape'){location.hash='hud/mouse'}});
route();fit();
</script>
