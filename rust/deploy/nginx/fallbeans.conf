# Fall Beans at /fallbeans/. Installed as /etc/nginx/apps.d/fallbeans.conf by `cargo xtask deploy`; the shared
# site (SharedServer repository) includes /etc/nginx/apps.d/*.conf inside its main server block.
#
# The game is a native client: its UDP (5888) goes to the server directly. Only the WebSocket fallback
# comes through here, for players whose UDP is cut (VPN rules, filtering): wss on TCP 443 passes wherever
# the site opens. /fallbeans/ws-probe is the temporary server of `cargo xtask stress --remote`.

location = /fallbeans/ws {
    proxy_pass http://127.0.0.1:5889;
    include /etc/nginx/apps.d/fallbeans.ws;
}

location = /fallbeans/ws-probe {
    proxy_pass http://127.0.0.1:5891;
    include /etc/nginx/apps.d/fallbeans.ws;
}
