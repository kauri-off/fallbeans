[workspace]
resolver = "3"
# core/: the deterministic simulation (no Bevy, its own clippy.toml); crates/: networking, server, client;
# tools/: helpers for the TS side (golden traces).
members = ["core/*", "crates/*", "tools/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fb_shared = { path = "core/fb_shared" }
fb_sim = { path = "core/fb_sim" }
fb_maps = { path = "core/fb_maps" }
fb_arena = { path = "core/fb_arena" }
fb_net = { path = "crates/fb_net" }
# Engine and networking: pinned exactly, they move together (see port/phases/0.md, "Ревизия решений и технологий").
bevy = { version = "=0.19.1", default-features = false }
bevy_render = { version = "=0.19.1", default-features = false }
lightyear = { version = "=0.30.1", default-features = false }
# What Lightyear 0.30.1 itself builds on; named here for APIs it does not re-export.
bevy_replicon = { version = "=0.44.2", default-features = false }
aeronet_websocket = { version = "=0.21.0", default-features = false }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
glam = { version = "0.32", default-features = false, features = ["std", "serde"] }
libm = "0.2"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

# Local fixes to dependencies, each to drop once upstream has it (rust/README.md, "Known issues").
[patch.crates-io]
# The WebSocket server leaves Nagle's algorithm on (only the client can turn it off): +15 ms RTT on wss.
aeronet_websocket = { path = "vendor/aeronet_websocket" }
