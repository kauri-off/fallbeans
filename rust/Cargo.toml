[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fb_shared = { path = "crates/fb_shared" }
fb_sim = { path = "crates/fb_sim" }
fb_maps = { path = "crates/fb_maps" }
fb_arena = { path = "crates/fb_arena" }
fb_net = { path = "crates/fb_net" }
bevy = { version = "=0.19.1", default-features = false }
lightyear = { version = "=0.30.1", default-features = false }
glam = { version = "0.32", default-features = false, features = ["std", "serde"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
